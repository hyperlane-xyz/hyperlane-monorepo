[package]
name = "telepathy-light-client"
version = "0.1.0"
edition = "2021"
description = "CosmWasm implementation of the Succinct Telepathy Light Client for Ethereum consensus"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = "1.5.0"
cosmwasm-std = { version = "1.5.0", features = ["staking"] }
cw-storage-plus = "1.2.0"
cw2 = "1.1.0"
schemars = "0.8.16"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
thiserror = "1.0.58"
hex = "0.4.3"

[dev-dependencies]
cw-multi-test = "0.20.0"
