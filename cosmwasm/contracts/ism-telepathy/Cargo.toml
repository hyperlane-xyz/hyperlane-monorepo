[package]
name = "ism-telepathy"
version = "0.1.0"
edition = "2021"
description = "CosmWasm Interchain Security Module (ISM) for verifying Hyperlane messages using Succinct TelepathyX"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = "1.5.0"
cosmwasm-std = { version = "1.5.0", features = ["staking"] }
cw-storage-plus = "1.2.0"
cw2 = "1.1.0"
schemars = "0.8.16"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
serde_json = "1.0.115"
thiserror = "1.0.58"
hex = "0.4.3"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
mpt-verify = { path = "../../packages/mpt-verify" }

[dev-dependencies]
cw-multi-test = "0.20.0"
rlp = "0.5.2"
