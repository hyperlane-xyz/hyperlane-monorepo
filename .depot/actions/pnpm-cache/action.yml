name: PNPM Cache
description: Cache pnpm dependencies for faster installs
inputs:
  cache-provider:
    description: 'Choose cache provider: buildjet or github'
    required: false
    default: github
outputs:
  cache-hit:
    description: Whether there was a cache hit
    value: ${{ steps.buildjet-cache.outputs.cache-hit ||
      steps.github-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    - name: Determine Cache Provider
      id: determine-cache
      shell: bash
      run: echo "cache_provider=${{ inputs.cache-provider }}" >> $GITHUB_ENV
    - name: Get pnpm cache metadata
      shell: bash
      env:
        PNPM_LOCKFILE_HASH: ${{ hashFiles('pnpm-lock.yaml',
          'typescript/warp-widget/examples/react-app/pnpm-lock.yaml') }}
      run: >
        pnpm_store_path="$(pnpm store path)"

        test -n "$pnpm_store_path"

        test -n "$PNPM_LOCKFILE_HASH"

        echo "HYP_PNPM_STORE_PATH=$pnpm_store_path" >> "$GITHUB_ENV"

        echo
        "HYP_PNPM_CACHE_KEY=pr9300-20261018-depot-${RUNNER_OS}-pnpm-12-store-${PNPM_LOCKFILE_HASH}"
        >> "$GITHUB_ENV"
    - name: Cache (Buildjet)
      id: buildjet-cache
      if: env.cache_provider == 'buildjet'
      uses: buildjet/cache@v4
      with:
        path: ${{ env.HYP_PNPM_STORE_PATH }}
        key: ${{ env.HYP_PNPM_CACHE_KEY }}
    - name: Cache (GitHub)
      id: github-cache
      if: env.cache_provider == 'github'
      uses: actions/cache@v6
      with:
        path: ${{ env.HYP_PNPM_STORE_PATH }}
        key: ${{ env.HYP_PNPM_CACHE_KEY }}
    - name: Benchmark cache metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCHMARK_CACHE_HIT: ${{ steps.github-cache.outputs.cache-hit ||
          steps.buildjet-cache.outputs.cache-hit || 'false' }}
      run: >
        cache_key_hash=$(printf '%s' "$HYP_PNPM_CACHE_KEY" | sha256sum | cut
        -c1-16)

        gh api --silent --method POST
        "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
        context="bench-cache:$BENCHMARK_CONTEXT" -f
        description="hit=$BENCHMARK_CACHE_HIT key=$cache_key_hash"
