name: benchmark-test-sdk-e2e
on:
  workflow_call:
    inputs:
      has_cosmos:
        type: string
      has_aleo:
        type: string
      has_radix:
        type: string
      has_starknet:
        type: string
      has_tron:
        type: string
      has_svm:
        type: string
env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_API: https://cache.depot.dev
  TURBO_TOKEN: ${{ secrets.DEPOT_TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.DEPOT_ORG_ID }}
jobs:
  cosmos-sdk-e2e-run:
    runs-on: depot-ubuntu-24.04-4
    if: inputs.has_cosmos == 'true'
    timeout-minutes: 20
    steps:
      - name: Benchmark runner resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
          context="bench-res:$BENCHMARK_CONTEXT" -f description="cpus=$(nproc)
          mem=$(free -b | awk '/^Mem:/ {print $2}')"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: pnpm-build
        uses: ./.depot/actions/pnpm-build-with-cache
        with:
          build-filter: '@hyperlane-xyz/cosmos-sdk...'
      - name: Cosmos SDK e2e tests
        run: pnpm -C typescript/cosmos-sdk test:e2e
    env:
      BENCHMARK_CONTEXT: benchmark-test-sdk-e2e.yml:cosmos-sdk-e2e-run:0
  aleo-sdk-e2e-matrix:
    runs-on: depot-ubuntu-24.04-4
    if: inputs.has_aleo == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - 1_interchain_security
          - 2_core
          - 3_post_dispatch
          - 4_warp
          - 5_ism_artifacts
          - 6_hook_artifacts
          - 7a_warp_native_artifacts
          - 7b_warp_collateral_artifacts
          - 7c_warp_synthetic_artifacts
          - 8_mailbox_artifacts
          - 9_validator_announce_artifacts
    steps:
      - name: Benchmark runner resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
          context="bench-res:$BENCHMARK_CONTEXT" -f description="cpus=$(nproc)
          mem=$(free -b | awk '/^Mem:/ {print $2}')"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: pnpm-build
        uses: ./.depot/actions/pnpm-build-with-cache
        with:
          build-filter: '@hyperlane-xyz/aleo-sdk...'
      - name: Aleo SDK e2e tests (${{ matrix.test }})
        run: pnpm -C typescript/aleo-sdk test:e2e
        env:
          ALEO_SDK_E2E_TEST: ${{ matrix.test }}
    env:
      BENCHMARK_CONTEXT: benchmark-test-sdk-e2e.yml:aleo-sdk-e2e-matrix:${{ strategy.job-index }}
  radix-sdk-e2e-run:
    runs-on: depot-ubuntu-24.04-4
    if: inputs.has_radix == 'true'
    timeout-minutes: 15
    steps:
      - name: Benchmark runner resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
          context="bench-res:$BENCHMARK_CONTEXT" -f description="cpus=$(nproc)
          mem=$(free -b | awk '/^Mem:/ {print $2}')"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: pnpm-build
        uses: ./.depot/actions/pnpm-build-with-cache
        with:
          build-filter: '@hyperlane-xyz/radix-sdk...'
      - name: Radix SDK e2e tests
        run: pnpm -C typescript/radix-sdk test:e2e
    env:
      BENCHMARK_CONTEXT: benchmark-test-sdk-e2e.yml:radix-sdk-e2e-run:0
  starknet-sdk-e2e-matrix:
    runs-on: depot-ubuntu-24.04-4
    if: inputs.has_starknet == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - ism
          - mailbox
          - hook
          - validator_announce
          - warp_core
          - warp_transfer
          - read-warp-token
        include:
          - test: read-warp-token
            continue-on-error: true
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - name: Benchmark runner resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
          context="bench-res:$BENCHMARK_CONTEXT" -f description="cpus=$(nproc)
          mem=$(free -b | awk '/^Mem:/ {print $2}')"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: pnpm-build
        uses: ./.depot/actions/pnpm-build-with-cache
        with:
          build-filter: '@hyperlane-xyz/starknet-sdk...'
      - name: Starknet SDK e2e tests (${{ matrix.test }})
        run: pnpm -C typescript/starknet-sdk test:e2e
        env:
          STARKNET_SDK_E2E_TEST: ${{ matrix.test }}
    env:
      BENCHMARK_CONTEXT: benchmark-test-sdk-e2e.yml:starknet-sdk-e2e-matrix:${{
        strategy.job-index }}
  tron-sdk-e2e-run:
    runs-on: depot-ubuntu-24.04-4
    if: inputs.has_tron == 'true'
    timeout-minutes: 15
    steps:
      - name: Benchmark runner resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
          context="bench-res:$BENCHMARK_CONTEXT" -f description="cpus=$(nproc)
          mem=$(free -b | awk '/^Mem:/ {print $2}')"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: pnpm-build
        uses: ./.depot/actions/pnpm-build-with-cache
        with:
          build-filter: '@hyperlane-xyz/tron-sdk...'
      - name: Tron SDK e2e tests with coverage
        run: pnpm -C typescript/tron-sdk coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: tron-sdk
          files: typescript/tron-sdk/coverage/lcov.info
          fail_ci_if_error: false
    env:
      BENCHMARK_CONTEXT: benchmark-test-sdk-e2e.yml:tron-sdk-e2e-run:0
  svm-sdk-e2e-matrix:
    runs-on: depot-ubuntu-24.04-4
    if: inputs.has_svm == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - ism
          - hook
          - mailbox
          - validator-announce
          - native-token
          - synthetic-token
          - collateral-token
          - cross-collateral-token
          - composite-ism
          - routing-message-id-multisig-ism-limits
          - provider
          - read-token
          - program-upgrade
          - program-extend-upgrade
          - igp-program-upgrade
          - mailbox-program-upgrade
          - warp-alt-simulation-parity
          - warp-fee-config
          - warp-quote-reader
          - warp-quote-writer
          - warp-transfer-remote-with-fees
          - fee-linear
          - fee-progressive
          - fee-regressive
          - fee-routing
          - fee-cross-collateral-routing
          - fee-offchain-quoted-linear
          - surfpool-offline
          - svm-fork-manager
        include:
          - test: read-token
            continue-on-error: true
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - name: Benchmark runner resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
          context="bench-res:$BENCHMARK_CONTEXT" -f description="cpus=$(nproc)
          mem=$(free -b | awk '/^Mem:/ {print $2}')"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: pnpm-build
        uses: ./.depot/actions/pnpm-build-with-cache
        with:
          build-filter: '@hyperlane-xyz/sealevel-sdk...'
      - name: SVM SDK e2e tests (${{ matrix.test }})
        run: pnpm -C typescript/svm-sdk test:e2e
        env:
          SVM_SDK_E2E_TEST: ${{ matrix.test }}
    env:
      BENCHMARK_CONTEXT: benchmark-test-sdk-e2e.yml:svm-sdk-e2e-matrix:${{ strategy.job-index }}
permissions:
  contents: read
  statuses: write
  pull-requests: read
  checks: read
