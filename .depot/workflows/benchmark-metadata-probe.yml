name: benchmark-metadata-probe
on:
  push:
    branches: [pbio/depot-ci-rebench-20261018]
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Record public runner metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=benchmark-metadata-probe \
            -f description="cpus=$(nproc) memory=$(free -b | awk '/^Mem:/ {print $2}')"
