name: 'Install Hyperlane CLI'
description: 'Install the Hyperlane CLI by packaging from a local build'

inputs:
  ref:
    description: 'The Git ref to checkout'
    required: true
  no-cache:
    description: 'Whether to skip the cache'
    required: false
    default: false
  build-filter:
    description: 'Turbo filter to scope the build'
    required: false
    default: '@hyperlane-xyz/cli...'
runs:
  using: 'composite'
  steps:
    - name: Configure script shell for Windows
      if: runner.os == 'Windows'
      shell: bash
      run: echo "script-shell=bash" >> .npmrc

    - name: pnpm-build-with-cache
      if: inputs.no-cache == 'false'
      uses: ./.github/actions/pnpm-build-with-cache
      with:
        build-filter: ${{ inputs.build-filter }}

    - name: Setup Foundry
      if: inputs.no-cache != 'false'
      uses: ./.github/actions/setup-foundry

    - name: Setup pnpm (no-cache path)
      if: inputs.no-cache != 'false'
      uses: pnpm/action-setup@v6

    - name: pnpm-install-build-without-cache
      if: inputs.no-cache != 'false'
      shell: bash
      env:
        BUILD_FILTER: ${{ inputs.build-filter }}
      run: |
        pnpm install --frozen-lockfile
        if [ -n "$BUILD_FILTER" ]; then
          pnpm exec turbo run build --filter="$BUILD_FILTER"
        else
          pnpm run build
        fi

    # pnpm's store does not cover the separate npm install of the packed CLI.
    # Cache downloads, not the installed executable, so every job still tests
    # a freshly packed and installed CLI from this checkout.
    - name: Locate npm download cache
      if: inputs.no-cache == 'false'
      id: npm-cache-path
      shell: bash
      run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

    - name: Cache packaged CLI dependencies
      if: inputs.no-cache == 'false'
      uses: actions/cache@v6
      with:
        path: ${{ steps.npm-cache-path.outputs.path }}
        key: cli-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          cli-npm-${{ runner.os }}-${{ runner.arch }}-

    - name: Pack the CLI
      shell: bash
      id: pack-cli
      run: pnpm -C typescript/cli pack

    - name: Install the packaged CLI
      shell: bash
      run: npm i -g --prefer-offline --no-audit --no-fund typescript/cli/hyperlane-xyz-cli-*.tgz
