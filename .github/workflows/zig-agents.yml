name: zig-agents

on:
  pull_request:
    paths:
      - 'zig/**'
      - 'rust/main/utils/run-locally/**'
      - 'rust/main/Cargo.toml'
      - 'rust/main/Cargo.lock'
      - 'rust/main/hyperlane-core/**'
      - 'rust/main/agents/scraper/migration/**'
      - 'vectors/**'
      - 'docs/zig-agent-rewrite/container.md'
      - '.github/workflows/zig-agents.yml'
  push:
    branches: [main, feat/zig-agent-rewrite]
    paths:
      - 'zig/**'
      - 'rust/main/utils/run-locally/**'
      - 'rust/main/Cargo.toml'
      - 'rust/main/Cargo.lock'
      - 'rust/main/hyperlane-core/**'
      - 'rust/main/agents/scraper/migration/**'
      - 'vectors/**'
      - 'docs/zig-agent-rewrite/container.md'
      - '.github/workflows/zig-agents.yml'
  workflow_dispatch:
    inputs:
      paired_linux:
        description: Run reviewed Linux paired input/proof preparation; timings require separate final authority
        type: boolean
        default: false
      aleo_full_case:
        description: Run only reviewed dedicated Aleo Safe/Fast full cases (requires actual same-job prerequisites)
        type: boolean
        default: false
      aleo_native_docker_prerequisite:
        description: Run only separately reviewed native Docker micro-prerequisites (no SDK or agents)
        type: boolean
        default: false
      aleo_linux_sdk_prerequisite:
        description: Run only locked Linux JS SDK prerequisites (no node or proof)
        type: boolean
        default: false
      aleo_linux_prerequisite:
        description: Run only the bounded Linux kernel capability probe (no SDK or node)
        type: boolean
        default: false
      svm_prerequisites:
        description: Run only the Linux SVM prerequisite job
        type: boolean
        default: false
      radix_reference:
        description: Add the independent Linux Radix reference to this full producer cohort
        type: boolean
        default: false
      cold_full_feature:
        description: Run the three full-feature cold trials
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: zig-agents-${{ github.ref }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  BUILD_JOBS: 2
  POSTGRES_DIGEST_A: 933463a6c8eba2b9f5cd414138738cd8
  POSTGRES_DIGEST_B: d5519cd2c471214c222652f547a66a32

jobs:
  svm-prerequisites:
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-paired-linux]')) || (github.event_name == 'workflow_dispatch' && inputs.paired_linux)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-fullcase-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_full_case)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-docker-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_native_docker_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-sdk-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_sdk_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-kernel-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_prerequisite)) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && ((github.event_name == 'workflow_dispatch' && inputs.svm_prerequisites) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && (contains(github.event.head_commit.message, '[zig-svm-prerequisites]') || contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]'))))))))) }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 200
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install SVM build prerequisites
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libssl-dev libudev-dev \
            pkg-config protobuf-compiler bubblewrap git ca-certificates python3 \
            apparmor=4.0.1really4.0.1-0ubuntu0.24.04.9 apparmor-profiles=4.0.1really4.0.1-0ubuntu0.24.04.9
      - name: Load distro bwrap user namespace policy
        timeout-minutes: 2
        run: |
          python3 -I -B - <<'PY'
          import errno, hashlib, json, os, stat, subprocess
          VERSION = '4.0.1really4.0.1-0ubuntu0.24.04.9'
          PROFILE = '/usr/share/apparmor/extra-profiles/bwrap-userns-restrict'
          TARGET = '/etc/apparmor.d/bwrap-userns-restrict'
          PROFILE_BYTES = 1936
          PROFILE_SHA = ('11d39094f044f0cda0febb3ad517b8303' '01da6b2ce929664af09ee9e4dd264f9')
          def regular(path, cap):
              fd = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  before = os.fstat(stream.fileno())
                  # Linux sysfs text attributes report PAGE_SIZE, not content length.
                  declared_cap = 4096 if path == '/sys/module/apparmor/parameters/enabled' and cap == 8 else cap
                  if not stat.S_ISREG(before.st_mode) or before.st_size > declared_cap:
                      raise ValueError('bounded regular policy input required')
                  wire = stream.read(cap + 1)
                  after = os.fstat(stream.fileno())
              if len(wire) > cap or (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns):
                  raise ValueError('policy input changed or exceeded bound')
              return wire

          def policy():
              result = {}
              for name in ('unprivileged_userns_clone', 'apparmor_restrict_unprivileged_userns'):
                  try:
                      wire = regular('/proc/sys/kernel/' + name, 32)
                  except OSError as error:
                      if error.errno != errno.ENOENT:
                          raise
                      result[name] = None
                      continue
                  if wire not in (b'0', b'0\n', b'1', b'1\n'):
                      raise ValueError('canonical optional namespace sysctl required')
                  result[name] = int(wire)
              return result

          def command(argv):
              result = subprocess.run(argv, check=True, capture_output=True, timeout=30)
              if len(result.stdout) > 1024 * 1024 or len(result.stderr) > 65536:
                  raise ValueError('bounded profile setup readback required')
              return result.stdout

          def configure_profile():
              before = policy()
              if before['unprivileged_userns_clone'] == 0:
                  raise ValueError('unprivileged user namespaces explicitly disabled')
              if before['apparmor_restrict_unprivileged_userns'] != 1:
                  after = policy()
                  if before != after:
                      raise ValueError('global namespace policy changed')
                  return {'profile_action': 'skipped_restriction_not_observed_enabled', 'packages': None, 'profile_bytes': None, 'profile_sha256': None, 'policy_before': before, 'policy_after': after, 'bwrap_enforced': None, 'unpriv_bwrap_enforced': None, 'global_restriction_disabled_by_setup': False}
              if regular('/sys/module/apparmor/parameters/enabled', 8).strip() != b'Y':
                  raise ValueError('active AppArmor required')
              versions = {}
              for package in ('apparmor', 'apparmor-profiles'):
                  value = command(['/usr/bin/dpkg-query', '-W', '-f=${Version}', package]).decode('ascii')
                  if value != VERSION:
                      raise ValueError('exact Noble AppArmor package required')
                  versions[package] = value
              wire = regular(PROFILE, 16384)
              if len(wire) != PROFILE_BYTES or hashlib.sha256(wire).hexdigest() != PROFILE_SHA:
                  raise ValueError('exact distro shipped bwrap policy required')
              for name in ('bwrap-userns-restrict', 'unpriv_bwrap'):
                  try:
                      local = regular('/etc/apparmor.d/local/' + name, 4096)
                  except FileNotFoundError:
                      continue
                  if any(line.strip() and not line.lstrip().startswith(b'#') for line in local.splitlines()):
                      raise ValueError('custom bwrap policy override refused')
              try:
                  existing = regular(TARGET, 16384)
              except FileNotFoundError:
                  existing = wire
              if existing != wire:
                  raise ValueError('conflicting installed bwrap profile refused')
              command(['/usr/bin/sudo', '-n', '/usr/bin/install', '-o', 'root', '-g', 'root', '-m', '0644', '--', PROFILE, TARGET])
              if regular(TARGET, 16384) != wire or regular(PROFILE, 16384) != wire:
                  raise ValueError('installed policy bytes differ')
              command(['/usr/bin/sudo', '-n', '/usr/sbin/apparmor_parser', '--replace', TARGET])
              loaded = command(['/usr/bin/sudo', '-n', '/usr/bin/head', '-c', '1048576', '/sys/kernel/security/apparmor/profiles'])
              if len(loaded) >= 1048576 or not {b'bwrap (enforce)', b'unpriv_bwrap (enforce)'} <= set(loaded.splitlines()):
                  raise ValueError('both restrictive profiles must be enforced')
              after = policy()
              if before != after:
                  raise ValueError('global namespace policy changed')
              return {'profile_action': 'loaded', 'packages': versions, 'profile_bytes': len(wire), 'profile_sha256': PROFILE_SHA, 'policy_before': before, 'policy_after': after, 'bwrap_enforced': True, 'unpriv_bwrap_enforced': True, 'global_restriction_disabled_by_setup': False}

          if __name__ == '__main__':
              print('SVM_BWRAP_POLICY ' + json.dumps(configure_profile(), sort_keys=True))
          PY
      - name: Check prerequisite owner controls
        run: |
          python3 -I -B zig/tools/svm_prerequisites_test.py
          python3 -I -B zig/tools/svm_spl_lock_test.py
      - name: Provision then compile exact SVM prerequisites
        timeout-minutes: 182
        shell: bash
        env:
          SVM_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec /usr/bin/python3 -I -B - <<'PY'
          import os, shutil
          rustup = shutil.which('rustup')
          if rustup is None or not os.access(rustup, os.X_OK):
              raise RuntimeError('runner rustup executable required')
          argv = ['/usr/bin/python3', '-I', '-B', 'zig/tools/svm_prerequisites.py', '--execute',
                  '--repo', os.environ['GITHUB_WORKSPACE'],
                  '--output', os.environ['RUNNER_TEMP'] + '/svm-prerequisites-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
                  '--rustup', rustup, '--bwrap', '/usr/bin/bwrap']
          clean = {'PATH': '/usr/bin:/bin', 'LC_ALL': 'C.UTF-8',
                   'SVM_GITHUB_TOKEN': os.environ['SVM_GITHUB_TOKEN']}
          os.execve('/usr/bin/python3', argv, clean)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: svm-linux-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          # Exact Linux85 Agave closure includes three public hidden metadata files.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/published
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/logs
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/source-before.json
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/observations.jsonl

  unit:
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-paired-linux]')) || (github.event_name == 'workflow_dispatch' && inputs.paired_linux)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-fullcase-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_full_case)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-docker-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_native_docker_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-sdk-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_sdk_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-kernel-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_prerequisite)) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites))))))) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        mode: [ReleaseSafe, ReleaseFast]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select the macOS 15.4 SDK supported by pinned Zig
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          test -f "$SDK/usr/lib/libSystem.tbd"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "HYPERLANE_ZIG_SDKROOT=$SDK" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install pinned Zig
        run: echo "ZIG=$(python3 zig/tools/bootstrap.py)" >> "$GITHUB_ENV"
      - name: Check formatting
        run: '"$ZIG" fmt --check zig/build.zig zig/src zig/bench/main.zig'
      - name: Test
        run: python3 zig/tools/zig.py build test -j"${BUILD_JOBS}" -Doptimize=${{ matrix.mode }} --summary all
      - name: Build complete default utility targets
        timeout-minutes: 10
        run: python3 zig/tools/zig.py build -Dtarget=native -Dcpu=baseline -j"${BUILD_JOBS}" -Doptimize=${{ matrix.mode }} --summary all

  evm:
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-paired-linux]')) || (github.event_name == 'workflow_dispatch' && inputs.paired_linux)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-fullcase-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_full_case)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-docker-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_native_docker_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-sdk-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_sdk_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-kernel-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_prerequisite)) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites))))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Install verified official Foundry v1.5.0
        env:
          FOUNDRY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B -W error zig/tools/foundry_official_test.py -v
          python3 -I -B zig/tools/foundry_official.py \
            --runner-temp "$RUNNER_TEMP" \
            --gh "$(readlink -f "$(command -v gh)")"
          cat -- "$RUNNER_TEMP/ziggy-foundry-v1.5.0/result.json"
          echo "$RUNNER_TEMP/ziggy-foundry-v1.5.0/bin" >> "$GITHUB_PATH"
      - name: Install pinned Zig
        run: echo "ZIG=$(python3 zig/tools/bootstrap.py)" >> "$GITHUB_ENV"
      - name: Build integration fixture
        run: python3 zig/tools/zig.py build integration-driver -j"${BUILD_JOBS}" -Doptimize=ReleaseSafe
      - name: Exercise repository Solidity contracts
        run: python3 zig/integration/evm.py --output zig/integration/.cache/result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-evm-integration
          path: zig/integration/.cache/result.json
          if-no-files-found: ignore

  native-http:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-http-diagnostic-only]') && contains(github.event.head_commit.message, '[zig-paired-linux]') && !contains(github.event.head_commit.message, '[zig-native-case]') && !contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) || (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-paired-linux]')) || (github.event_name == 'workflow_dispatch' && inputs.paired_linux)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-fullcase-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_full_case)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-docker-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_native_docker_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-sdk-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_sdk_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-kernel-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_prerequisite)) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites)))))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check native HTTP command ownership before compilation
        env:
          NATIVE_HTTP_CONTROL_OUTPUT: ${{ runner.temp }}/native-http-controls
        run: python3 -W error -m unittest discover -s zig/tools -p native_http_tests_test.py -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned Zig
        run: echo "ZIG=$(python3 zig/tools/bootstrap.py)" >> "$GITHUB_ENV"
      - name: Exercise actual native HTTP/2 and cancellation
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-http-diagnostic-only]') && contains(github.event.head_commit.message, '[zig-paired-linux]') && !contains(github.event.head_commit.message, '[zig-native-case]') && !contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) }}
        run: python3 zig/tools/native_http_tests.py --timeout-seconds 1200 --diagnostic-dir "$RUNNER_TEMP/native-http-diagnostics" -- python3 zig/tools/zig.py test src/root.zig -j"${BUILD_JOBS}" -OReleaseSafe -lc
      - name: Diagnose native HTTP test312
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && (contains(github.event.head_commit.message, '[zig-native-http-diagnostic]') || (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-http-diagnostic-only]') && contains(github.event.head_commit.message, '[zig-paired-linux]') && !contains(github.event.head_commit.message, '[zig-native-case]') && !contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]'))) && !contains(github.event.head_commit.message, '[zig-native-case]') && !contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]') }}
        continue-on-error: true
        timeout-minutes: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-http-diagnostic-only]') && contains(github.event.head_commit.message, '[zig-paired-linux]') && !contains(github.event.head_commit.message, '[zig-native-case]') && !contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && contains(github.event.head_commit.message, '[zig-native-http-full-suite]')) && 23 || 7 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B zig/tools/native_http_312_diagnostic_test.py
          python3 -I -B zig/tools/native_http_312_diagnostic.py --output "$RUNNER_TEMP/native-http-312-diagnostic"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-native-http-diagnostics
          path: |
            ${{ runner.temp }}/native-http-diagnostics/
            ${{ runner.temp }}/native-http-controls/
            ${{ runner.temp }}/native-http-312-diagnostic/context.json
            ${{ runner.temp }}/native-http-312-diagnostic/summary.json
            ${{ runner.temp }}/native-http-312-diagnostic/diagnostic.log
            ${{ runner.temp }}/native-http-312-diagnostic/source-original.json
            ${{ runner.temp }}/native-http-312-diagnostic/source-compiled.json
            ${{ runner.temp }}/native-http-312-diagnostic/source-restored.json
            ${{ runner.temp }}/native-http-312-diagnostic/outer-owner/
            ${{ runner.temp }}/native-http-312-diagnostic/inner-owner/
