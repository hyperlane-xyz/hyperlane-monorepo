  native-case-producer-inputs:
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-paired-linux]')) || (github.event_name == 'workflow_dispatch' && inputs.paired_linux)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-fullcase-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_full_case)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-docker-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_native_docker_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-sdk-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_sdk_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-kernel-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_prerequisite)) && (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')))))) }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Check producer provenance and closed-artifact controls
        run: python3 -I -B zig/bench/native_case_ci_test.py -v
      - name: Read exact checked-in native selector without granting case acceptance
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-case-selection"
          python3 - <<'PYTHON'
          import importlib.util, json, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('native_case_ci',Path('zig/bench/native_case_ci.py'))
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          path=Path('zig/bench/native_case_request.json').resolve()
          request=module.read_request(path)
          assert type(request.get('schema')) is int and request['schema']==1 and type(request.get('root_approved')) is bool
          enabled=request['root_approved']
          if enabled: module.validate_request(request)
          receipt={'schema':1,'reviewed_request':module.pin(path),'execution_source_commit':os.environ['GITHUB_SHA'],'producer_download_authorized':enabled,'native_case_acceptance':False,'scope':'Producer-input staging only; actual case requires separate hydration/interop/setup/owned-run evidence.'}
          (Path(os.environ['RUNNER_TEMP'])/'native-case-selection'/'selection.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:output.write('enabled='+str(enabled).lower()+'\n');output.write('sha256='+module.pin(path)['sha256']+'\n');output.write('scenario='+(request['scenario'] if enabled else '')+'\n')
