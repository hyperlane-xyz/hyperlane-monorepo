            ${{ runner.temp }}/native-interop-writer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/output/manifest.json
            ${{ runner.temp }}/native-interop-writer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/output/diagnostics/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-full-sdk-native-${{ matrix.mode }}
          path: zig/bench/results/full-sdk-${{ matrix.mode }}/
