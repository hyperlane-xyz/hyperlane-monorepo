          python3 -I -B zig/tools/foundry_official.py \
            --runner-temp "$RUNNER_TEMP" \
            --gh "$(readlink -f "$(command -v gh)")"
          cat -- "$RUNNER_TEMP/ziggy-foundry-v1.5.0/result.json"
          echo "$RUNNER_TEMP/ziggy-foundry-v1.5.0/bin" >> "$GITHUB_PATH"
      - name: Stage the same ordinary consumer tools and exact canonical PostgreSQL16
        if: steps.runtime.outputs.runtime_enabled == 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake libclang-dev libcurl4-openssl-dev libpq-dev libssl-dev libudev-dev pkg-config protobuf-compiler postgresql-client-16 lsof jq python3 openssl
          docker pull "postgres@sha256:${PAIRED_PG16_DIGEST_A}${PAIRED_PG16_DIGEST_B}"
      - name: Reuse the actual Root-qualified once-input artifact and six proofs
        if: steps.runtime.outputs.runtime_enabled == 'true'
        timeout-minutes: 32
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B zig/bench/paired_linux_runtime_ci.py reuse \
            --request "$GITHUB_WORKSPACE/zig/bench/paired_linux_runtime_request.json" \
            --request-sha256 '${{ steps.runtime.outputs.request_sha256 }}' \
            --repo "$GITHUB_WORKSPACE" --gh "$(command -v gh)" \
            --output "$RUNNER_TEMP/paired-runtime-reuse-${{ matrix.index }}"
      - name: Check actual job budget and supervise the unchanged original workload
        id: measured
        if: steps.runtime.outputs.runtime_enabled == 'true'
        timeout-minutes: 306
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REUSE="$RUNNER_TEMP/paired-runtime-reuse-${{ matrix.index }}/reuse-result-binding.json"
          REUSE_SHA="$(sha256sum "$REUSE" | cut -d' ' -f1)"
          MINT="$RUNNER_TEMP/paired-runtime-mint-${{ matrix.index }}"
          OWNER="$RUNNER_TEMP/paired-runtime-owner-${{ matrix.index }}"
          python3 -I -B zig/bench/paired_linux_runtime_ci.py mint \
            --request "$GITHUB_WORKSPACE/zig/bench/paired_linux_runtime_request.json" \
            --request-sha256 '${{ steps.runtime.outputs.request_sha256 }}' \
            --repo "$GITHUB_WORKSPACE" --gh "$(command -v gh)" \
            --reuse "$REUSE" --reuse-sha256 "$REUSE_SHA" \
            --index '${{ matrix.index }}' --output "$MINT" --owner-output "$OWNER"
          AUTHORITY_SHA="$(sha256sum "$MINT/runtime-authority.json" | cut -d' ' -f1)"
          exec env -u GH_TOKEN python3 -I -B zig/bench/paired_linux_runtime_owner.py \
            --runtime-authority "$MINT/runtime-authority.json" \
            --runtime-authority-sha256 "$AUTHORITY_SHA" \
            --reuse "$REUSE" --reuse-sha256 "$REUSE_SHA" \
            --repo "$GITHUB_WORKSPACE" --index '${{ matrix.index }}' --output "$OWNER"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.runtime.outputs.runtime_enabled == 'true'
        with:
          name: paired-linux-runtime-${{ matrix.index }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          # Original raw workload directory is exact Source-derived output;
          # input payload/SDKs, manager token/env and command API logs excluded.
          path: |
            ${{ runner.temp }}/paired-runtime-owner-${{ matrix.index }}/owner-result.json
            ${{ runner.temp }}/paired-runtime-owner-${{ matrix.index }}/resources.jsonl
            ${{ runner.temp }}/paired-runtime-owner-${{ matrix.index }}/worker/result.json
            ${{ runner.temp }}/paired-runtime-mint-${{ matrix.index }}/mint-result.json
            ${{ runner.temp }}/paired-runtime-mint-${{ matrix.index }}/runtime-authority.json
            ${{ runner.temp }}/paired-runtime-mint-${{ matrix.index }}/actual-prework-quiet-and-budget.json
            ${{ runner.temp }}/paired-runtime-reuse-${{ matrix.index }}/reuse-result.json
            ${{ runner.temp }}/paired-runtime-reuse-${{ matrix.index }}/reuse-result-binding.json
            ${{ runner.temp }}/paired-runtime-reuse-${{ matrix.index }}/accepted-six.json
            ${{ steps.measured.outputs.raw_output }}
