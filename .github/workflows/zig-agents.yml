  # Separate fresh VM per trial. Compiler-pair positions rotate; prerequisites remain fixed first.
  cold-full-feature:
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-paired-linux]')) || (github.event_name == 'workflow_dispatch' && inputs.paired_linux)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-fullcase-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_full_case)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-docker-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_native_docker_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-sdk-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_sdk_prerequisite)) && (!((github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-aleo-kernel-only]')) || (github.event_name == 'workflow_dispatch' && inputs.aleo_linux_prerequisite)) && ((!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]') && contains(github.event.head_commit.message, '[zig-cold-full-feature]'))) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && ((github.event_name == 'workflow_dispatch' && inputs.cold_full_feature && !inputs.svm_prerequisites) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]') && contains(github.event.head_commit.message, '[zig-cold-full-feature]'))))))))) }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 300
    env:
      COLD_EVIDENCE: /tmp/ziggy-cold-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.trial }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - trial: 1
            order: rust-safe-fast
          - trial: 2
            order: safe-fast-rust
          - trial: 3
            order: fast-rust-safe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check cold ownership and generated-binding regression controls
        run: |
          python3 -B zig/bench/build_matrix_test.py
          python3 -I -B - <<'PYTHON'
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path('zig/bench').resolve()))
          from native_case_ci import read_request
          request = read_request(pathlib.Path('zig/bench/native_case_request.json'))
          if request.get('root_approved') is not False:
              raise SystemExit('Cold trials require an explicitly inactive native selector')
          PYTHON
      - name: Stage compiler and exact dependency sources outside timers
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake libclang-dev libcurl4-openssl-dev libpq-dev libssl-dev libudev-dev make pkg-config protobuf-compiler python3
          rustup toolchain install 1.98.0 --profile minimal
          ZIG="$(python3 zig/tools/bootstrap.py)"
          echo "ZIG=$ZIG" >> "$GITHUB_ENV"
          python3 zig/tools/fixture_pack.py restore-locks
          python3 zig/tools/native_deps.py --restore-only
          python3 zig/src/net/native-url/locked.py --restore-only
          python3 zig/src/starknet/testing/locked.py --restore-only
          python3 zig/src/aleo/testing/locked.py --restore-only
          python3 zig/src/ops/tools/locked.py --restore-only
          for manifest in rust/main/Cargo.toml zig/native/rocks/Cargo.toml zig/src/net/native-url/Cargo.toml zig/src/ops/regex-native/Cargo.toml zig/src/starknet/native-crypto/Cargo.toml zig/src/aleo/native-crypto/Cargo.toml zig/src/aleo/native-vm/Cargo.toml; do
            cargo +1.98.0 fetch --locked --manifest-path "$manifest"
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          mkdir -p "$COLD_EVIDENCE/setup"
          { uname -a; lscpu; df -B1 . "$RUNNER_TEMP"; free -b; rustc +1.98.0 -vV; cargo +1.98.0 -V; "$ZIG" version; clang --version; cmake --version; protoc --version; } > "$COLD_EVIDENCE/setup/platform.txt"
          sha256sum "$ZIG" zig/bench/build_matrix.py zig/bench/cold_matrix_owner.py zig/bench/cache_reclaim.py > "$COLD_EVIDENCE/setup/runner-inputs.sha256"
          dpkg-query -W > "$COLD_EVIDENCE/setup/system-packages.txt"
      - name: Require forty GiB AFTER staging and record exact native runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, shutil
          roots=[pathlib.Path.cwd(),pathlib.Path(os.environ['RUNNER_TEMP'])]
          records=[{'path':str(p),'device':p.stat().st_dev,'free_bytes':shutil.disk_usage(p).free}for p in roots]
          (pathlib.Path(os.environ['COLD_EVIDENCE'])/'setup/capacity.json').write_text(json.dumps(records,indent=2)+'\n')
          assert all(r['free_bytes']>=40*1024**3 for r in records)
          PYTHON
          LIBPQ="$(readlink -f "$(pkg-config --variable=libdir libpq)/libpq.so.5")"
          echo "LIBPQ=$LIBPQ" >> "$GITHUB_ENV"
          TRIAL_ROOT="$RUNNER_TEMP/ziggy-cold-trial-${{ matrix.trial }}"
