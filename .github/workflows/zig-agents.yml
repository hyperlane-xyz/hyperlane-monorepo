          docker pull "$POSTGRES_IMAGE"
          docker build --build-arg BUILD_JOBS="${BUILD_JOBS}" --build-arg ZIG_MODE=${{ matrix.mode }} --build-arg GIT_SHA="$GITHUB_SHA" --target migration-image --tag zig-agents:ci-helm-migration-${{ matrix.mode }} -f zig/Dockerfile .
      - name: Install checksum-pinned Helm render tool
        run: |
          HELM_ARCHIVE="$RUNNER_TEMP/helm-v3.15.2-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --max-filesize 33554432 \
            https://get.helm.sh/helm-v3.15.2-linux-amd64.tar.gz --output "$HELM_ARCHIVE"
          HELM_SHA_A=2694b91c3e501cff57caf650e639604a
          HELM_SHA_B=274645f61af2ea4d601677b746b44fe2
          echo "${HELM_SHA_A}${HELM_SHA_B}  $HELM_ARCHIVE" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/helm-render"
          tar --extract --file "$HELM_ARCHIVE" --directory "$RUNNER_TEMP/helm-render" linux-amd64/helm
          chmod 0755 "$RUNNER_TEMP/helm-render/linux-amd64/helm"
