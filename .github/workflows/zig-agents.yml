name: zig-agents

on:
  pull_request:
    paths:
      - 'zig/**'
      - 'rust/main/utils/run-locally/**'
      - 'rust/main/Cargo.toml'
      - 'rust/main/Cargo.lock'
      - 'rust/main/hyperlane-core/**'
      - 'rust/main/agents/scraper/migration/**'
      - 'vectors/**'
      - 'docs/zig-agent-rewrite/container.md'
      - '.github/workflows/zig-agents.yml'
  push:
    branches: [main, feat/zig-agent-rewrite]
    paths:
      - 'zig/**'
      - 'rust/main/utils/run-locally/**'
      - 'rust/main/Cargo.toml'
      - 'rust/main/Cargo.lock'
      - 'rust/main/hyperlane-core/**'
      - 'rust/main/agents/scraper/migration/**'
      - 'vectors/**'
      - 'docs/zig-agent-rewrite/container.md'
      - '.github/workflows/zig-agents.yml'
  workflow_dispatch:
    inputs:
      svm_prerequisites:
        description: Run only the Linux SVM prerequisite job
        type: boolean
        default: false
      cold_full_feature:
        description: Run the three full-feature cold trials
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: zig-agents-${{ github.ref }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  BUILD_JOBS: 2
  POSTGRES_DIGEST_A: 933463a6c8eba2b9f5cd414138738cd8
  POSTGRES_DIGEST_B: d5519cd2c471214c222652f547a66a32

jobs:
  svm-prerequisites:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && ((github.event_name == 'workflow_dispatch' && inputs.svm_prerequisites) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && (contains(github.event.head_commit.message, '[zig-svm-prerequisites]') || contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')))) }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 200
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install SVM build prerequisites
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libssl-dev libudev-dev \
            pkg-config protobuf-compiler bubblewrap git ca-certificates python3
      - name: Check prerequisite owner controls
        run: |
          python3 -I -B zig/tools/svm_prerequisites_test.py
          python3 -I -B zig/tools/svm_spl_lock_test.py
      - name: Provision then compile exact SVM prerequisites
        timeout-minutes: 182
        shell: bash
        run: |
          set -euo pipefail
          RUSTUP_BIN="$(command -v rustup)"
          test -x "$RUSTUP_BIN"
          exec env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 \
            python3 -I -B zig/tools/svm_prerequisites.py --execute \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/svm-prerequisites-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --rustup "$RUSTUP_BIN" --bwrap /usr/bin/bwrap
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: svm-linux-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/published
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/logs
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/source-before.json
            ${{ runner.temp }}/svm-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/observations.jsonl

  unit:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        mode: [ReleaseSafe, ReleaseFast]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select the macOS 15.4 SDK supported by pinned Zig
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          test -f "$SDK/usr/lib/libSystem.tbd"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "HYPERLANE_ZIG_SDKROOT=$SDK" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install pinned Zig
        run: echo "ZIG=$(python3 zig/tools/bootstrap.py)" >> "$GITHUB_ENV"
      - name: Check formatting
        run: '"$ZIG" fmt --check zig/build.zig zig/src zig/bench/main.zig'
      - name: Test
        run: python3 zig/tools/zig.py build test -j"${BUILD_JOBS}" -Doptimize=${{ matrix.mode }} --summary all

  evm:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.0
      - name: Install pinned Zig
        run: echo "ZIG=$(python3 zig/tools/bootstrap.py)" >> "$GITHUB_ENV"
      - name: Build integration fixture
        run: python3 zig/tools/zig.py build integration-driver -j"${BUILD_JOBS}" -Doptimize=ReleaseSafe
      - name: Exercise repository Solidity contracts
        run: python3 zig/integration/evm.py --output zig/integration/.cache/result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-evm-integration
          path: zig/integration/.cache/result.json
          if-no-files-found: ignore

  native-http:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check native HTTP command ownership before compilation
        env:
          NATIVE_HTTP_CONTROL_OUTPUT: ${{ runner.temp }}/native-http-controls
        run: python3 -W error -m unittest discover -s zig/tools -p native_http_tests_test.py -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned Zig
        run: echo "ZIG=$(python3 zig/tools/bootstrap.py)" >> "$GITHUB_ENV"
      - name: Exercise actual native HTTP/2 and cancellation
        run: python3 zig/tools/native_http_tests.py --timeout-seconds 1200 --diagnostic-dir "$RUNNER_TEMP/native-http-diagnostics" -- python3 zig/tools/zig.py test src/root.zig -j"${BUILD_JOBS}" -OReleaseSafe -lc
      - name: Diagnose native HTTP test312
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-http-diagnostic]') && !contains(github.event.head_commit.message, '[zig-native-case]') && !contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]') }}
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B zig/tools/native_http_312_diagnostic_test.py
          python3 -I -B zig/tools/native_http_312_diagnostic.py --output "$RUNNER_TEMP/native-http-312-diagnostic"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-native-http-diagnostics
          path: |
            ${{ runner.temp }}/native-http-diagnostics/
            ${{ runner.temp }}/native-http-controls/
            ${{ runner.temp }}/native-http-312-diagnostic/context.json
            ${{ runner.temp }}/native-http-312-diagnostic/summary.json
            ${{ runner.temp }}/native-http-312-diagnostic/diagnostic.log
            ${{ runner.temp }}/native-http-312-diagnostic/source-original.json
            ${{ runner.temp }}/native-http-312-diagnostic/source-compiled.json
            ${{ runner.temp }}/native-http-312-diagnostic/source-restored.json
            ${{ runner.temp }}/native-http-312-diagnostic/outer-owner/
            ${{ runner.temp }}/native-http-312-diagnostic/inner-owner/
          if-no-files-found: ignore

  native-linux:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites)) }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    env:
      HYPERLANE_CURL_LIBRARY: libcurl.so.4
      HYPERLANE_LIBCRYPTO_LIBRARY: libcrypto.so.3
      HYPERLANE_URL_LIBRARY: ${{ github.workspace }}/zig/src/net/native-url/target/release/libziggy_url.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.0
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake libclang-dev libcurl4-openssl-dev libpq-dev libssl-dev make pkg-config python3
      - name: Select Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Install pinned Zig
        run: echo "ZIG=$(python3 zig/tools/bootstrap.py)" >> "$GITHUB_ENV"
      - name: Build exact Rust URL metadata helper
        run: python3 zig/src/net/native-url/locked.py --toolchain 1.98.0
      - name: Build pinned RocksDB 10.4.2 archives
        run: |
          mkdir -p zig/bench/results/native-linux
          python3 zig/tools/fixture_pack.py restore-locks
          python3 zig/tools/native_deps.py --restore-only
          cargo +1.98.0 fetch --locked --manifest-path zig/native/rocks/Cargo.toml
          python3 zig/tools/native_deps.py --offline --jobs "${BUILD_JOBS}" \
            --target-dir zig/native/rocks/target-ci \
            --output zig/bench/results/native-linux/deps \
            --format json > zig/bench/results/native-linux/bootstrap.json
          echo "LIBS=$(python3 -c 'import json; print(json.load(open("zig/bench/results/native-linux/deps/manifest.json"))["native_db_libs"])')" >> "$GITHUB_ENV"
      - name: Resolve actual libpq and GNU unwind ELFs
        run: |
          LIBPQ="$(readlink -f "$(pkg-config --variable=libdir libpq)/libpq.so.5")"
          GNU_UNWIND="$(readlink -f "$(c++ -print-file-name=libgcc_s.so.1)")"
          readelf -h "$LIBPQ" "$GNU_UNWIND"
          echo "LIBPQ=$LIBPQ" >> "$GITHUB_ENV"
          echo "LIBS=$LIBS,$GNU_UNWIND" >> "$GITHUB_ENV"
      - name: Test native DB and build relayer/validator
        run: |
          python3 zig/tools/native_http_tests.py --timeout-seconds 3600 -- \
            python3 zig/tools/zig.py build -j"${BUILD_JOBS}" native-db-test relayer validator \
            -Doptimize=ReleaseSafe "-Dgit-sha=$GITHUB_SHA" "-Dnative-db-libs=$LIBS" --summary all
      - name: Test durable directory fsync variants
        run: |
          IFS=',' read -r -a native_libs <<< "$LIBS"
          python3 zig/tools/zig.py test src/durable_directory_tests.zig -O ReleaseSafe -j"${BUILD_JOBS}" -lc -lstdc++ "${native_libs[@]}"
      - name: Build scraper
        run: python3 zig/tools/zig.py build -j"${BUILD_JOBS}" scraper -Doptimize=ReleaseSafe "-Dgit-sha=$GITHUB_SHA" "-Dlibpq-library=$LIBPQ"
      - name: Compile relayer Bridge Solidity fixtures
        run: |
          python3 zig/integration/relayer_process.py --compile-only
          PYTHONPATH=zig/integration python3 - <<'PYTHON'
          import evm
          evm.CACHE.mkdir(parents=True, exist_ok=True)
          evm.CONTRACTS["TestInterchainGasPaymaster"] = "solidity/contracts/test/TestInterchainGasPaymaster.sol"
          evm.compile_contracts()
          PYTHON
      - name: Test native WS and WSS transports
        run: |
          openssl version
          export HYPERLANE_CURL_LIBRARY=libcurl.so.4
          export HYPERLANE_LIBCRYPTO_LIBRARY=libcrypto.so.3
          python3 zig/tools/zig.py test src/socket_owner_tests.zig -O ReleaseSafe -j"${BUILD_JOBS}" -lc
          python3 zig/tools/zig.py test src/websocket_delegated_tests.zig -O ReleaseSafe -j"${BUILD_JOBS}" -lc
      - name: Test relayer Bridge fixtures from repository root
        run: |
          mkdir -p zig/bench/results/native-linux
          IFS=',' read -r -a native_libs <<< "$LIBS"
          python3 zig/tools/zig.py build-exe src/relayer_bridge_tests.zig -O ReleaseSafe -j"${BUILD_JOBS}" -lc -lstdc++ "${native_libs[@]}" -femit-bin="$GITHUB_WORKSPACE/zig/bench/results/native-linux/relayer_bridge_tests"
          cd "$GITHUB_WORKSPACE"
          ./zig/bench/results/native-linux/relayer_bridge_tests
      - name: Test exact Rust regex semantics
        run: |
          python3 zig/src/ops/tools/locked.py --toolchain 1.98.0
          export ZIGGY_REGEX_LIBRARY="$PWD/zig/src/ops/regex-native/target/release/libziggy_regex.so"
          python3 zig/tools/zig.py test src/ops_tests.zig -O ReleaseSafe -j"${BUILD_JOBS}" -lc
      - name: Test PostgreSQL 16.15 and all 21 migrations
        run: |
          POSTGRES_IMAGE="postgres:16.15@sha256:${POSTGRES_DIGEST_A}${POSTGRES_DIGEST_B}"
          docker pull "$POSTGRES_IMAGE"
          python3 zig/tools/native_http_tests.py --timeout-seconds 1800 -- \
            python3 zig/integration/postgres.py --compiler "$ZIG" \
            --libpq-library "$LIBPQ" --image "$POSTGRES_IMAGE" \
            --scraper-binary zig/zig-out/bin/scraper \
            --output zig/bench/results/native-linux/postgres
          python3 -c 'import json; r=json.load(open("zig/bench/results/native-linux/postgres/postgres-integration.json")); assert r["production_migrations_applied"] == 21; assert "16.15" in r["server"]'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-native-linux
          path: |
            zig/bench/results/native-linux/
            zig/zig-out/bin/
          if-no-files-found: warn

  container:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites)) }}
    needs: native-linux
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: zig-native-linux
          path: zig
      - name: Restore executable permissions and check static package
        run: |
          chmod +x zig/entrypoint.sh zig/zig-out/bin/*
          python3 zig/tools/container_check.py static --output zig/bench/results/container/static.json
      - name: Build core and fixture-only Linux migration images
        run: |
          docker build --build-arg BUILD_JOBS="${BUILD_JOBS}" --build-arg GIT_SHA="$GITHUB_SHA" --target runtime-core --tag zig-agents:ci-core -f zig/Dockerfile .
          docker build --build-arg BUILD_JOBS="${BUILD_JOBS}" --build-arg GIT_SHA="$GITHUB_SHA" --target migration-image --tag zig-agents:ci-migration -f zig/Dockerfile .
      - name: Check image and run local SIGTERM/restart smoke
        run: python3 zig/tools/container_check.py runtime --image zig-agents:ci-core --smoke --migration-image zig-agents:ci-migration --expected-git-sha "$GITHUB_SHA" --output zig/bench/results/container/runtime.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-container-core
          path: zig/bench/results/container/
          if-no-files-found: warn

  vm-images:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites)) }}
    strategy:
      fail-fast: false
      matrix:
        variant: [starknet, aleo]
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check static package
        run: |
          chmod +x zig/entrypoint.sh
          python3 zig/tools/container_check.py static --output zig/bench/results/container-${{ matrix.variant }}/static.json
      - name: Build qualified SDK image
        run: docker build --build-arg BUILD_JOBS="${BUILD_JOBS}" --build-arg GIT_SHA="$GITHUB_SHA" --target runtime-${{ matrix.variant }} --tag zig-agents:ci-${{ matrix.variant }} -f zig/Dockerfile .
      - name: Check SDK image linkage and role help
        run: python3 zig/tools/container_check.py runtime --image zig-agents:ci-${{ matrix.variant }} --output zig/bench/results/container-${{ matrix.variant }}/runtime.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-container-${{ matrix.variant }}
          path: zig/bench/results/container-${{ matrix.variant }}/
          if-no-files-found: warn

  # Explicit, resource-qualified SDK correctness. Not an eight-family native gate.
  # Feature-branch push or manual dispatch; capacity checked before SDK build.
  full-sdk-native:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && ((github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite')))) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [ReleaseSafe, ReleaseFast]
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require SDK correctness capacity
        run: |
          python3 - <<'PY'
          import json, os
          v = os.statvfs('.')
          disk = v.f_bavail * v.f_frsize
          available = int(next(line.split()[1] for line in open('/proc/meminfo') if line.startswith('MemAvailable:'))) * 1024
          print(json.dumps({'free_bytes': disk, 'available_memory_bytes': available}))
          assert disk >= 32 * 1024**3, 'Need32GiB free for the separate SDK build allocation'
          assert available >= 6 * 1024**3, 'Need6GiB available for bounded native proof fixture'
          PY
      - name: Check exact SDK payload publication contract
        run: python3 -W error -m unittest discover -s zig/bench -p native_payload_export_test.py -v
      - name: Build matching-mode full SDK runtime and test fixture
        run: |
          docker build --build-arg BUILD_JOBS="${BUILD_JOBS}" --build-arg ZIG_MODE=${{ matrix.mode }} --build-arg GIT_SHA="$GITHUB_SHA" --target runtime-full-sdk --tag zig-agents:ci-full-${{ matrix.mode }} -f zig/Dockerfile .
          docker build --build-arg BUILD_JOBS="${BUILD_JOBS}" --build-arg ZIG_MODE=${{ matrix.mode }} --build-arg GIT_SHA="$GITHUB_SHA" --target full-sdk-fixture --tag zig-agents:ci-fixture-${{ matrix.mode }} -f zig/Dockerfile .
      - name: Run actual full-SDK native suite after all libraries and worker exist
        run: |
          mkdir -p zig/bench/results/full-sdk-${{ matrix.mode }}
          docker run --rm --network none --memory=6g --memory-swap=6g --cpus=2 --pids-limit=256 --workdir /work --mount type=bind,src="$PWD/zig/bench/results/full-sdk-${{ matrix.mode }}",dst=/evidence --entrypoint python3 zig-agents:ci-fixture-${{ matrix.mode }} zig/tools/container_check.py native-suite --mode ${{ matrix.mode }} --jobs "${BUILD_JOBS}" --output /evidence/native.json
      - name: Read back actual runtime SDK payloads
        run: |
          python3 zig/tools/container_check.py runtime --image zig-agents:ci-full-${{ matrix.mode }} --output zig/bench/results/full-sdk-${{ matrix.mode }}/runtime.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('zig/bench/results/full-sdk-${{ matrix.mode }}')
          native = json.loads((base / 'native.json').read_text())
          runtime = json.loads((base / 'runtime.json').read_text())
          assert native['passed'] and runtime['passed']
          assert native['artifact_sha256'] == runtime['artifact_sha256'], 'Tested libraries/worker/roles differ from packaged payloads'
          PY
      - name: Export exact nine tested Linux runtime payloads without starting the image
        run: |
          python3 zig/bench/native_payload_export.py \
            --image zig-agents:ci-full-${{ matrix.mode }} --mode ${{ matrix.mode }} \
            --git-sha "$GITHUB_SHA" --docker "$(command -v docker)" \
            --native zig/bench/results/full-sdk-${{ matrix.mode }}/native.json \
            --runtime zig/bench/results/full-sdk-${{ matrix.mode }}/runtime.json \
            --output "$RUNNER_TEMP/native-runtime-payload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.mode }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-native-runtime-payload-${{ matrix.mode }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-runtime-payload-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/payload/
            ${{ runner.temp }}/native-runtime-payload-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/receipts/
            ${{ runner.temp }}/native-runtime-payload-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/build-cpu/
            ${{ runner.temp }}/native-runtime-payload-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/manifest.json
      - name: Compile matching-mode native-row interoperability writer (never execute it)
        run: |
          set -euo pipefail
          WRITER_PARENT="$RUNNER_TEMP/native-interop-writer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.mode }}"
          mkdir -m 700 "$WRITER_PARENT"
          mkdir -m 777 "$WRITER_PARENT/output"
          FIXTURE_ID="$(docker image inspect --format '{{.Id}}' zig-agents:ci-fixture-${{ matrix.mode }})"
          docker run --rm --pull=never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 10001:10001 \
            --memory=6g --memory-swap=6g --cpus=2 --pids-limit=256 \
            --ulimit fsize=1073741824:1073741824 \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g --workdir /work \
            --env HOME=/tmp --env TMPDIR=/tmp --env PYTHONDONTWRITEBYTECODE=1 \
            --mount type=bind,src="$WRITER_PARENT/output",dst=/evidence \
            --entrypoint python3 "$FIXTURE_ID" zig/bench/native_interop_writer_export.py \
            --mode ${{ matrix.mode }} --jobs "${BUILD_JOBS}" --git-sha "$GITHUB_SHA" --output /evidence
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-native-interop-writer-${{ matrix.mode }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-interop-writer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/output/bin/native-rows-writer-${{ matrix.mode }}
            ${{ runner.temp }}/native-interop-writer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/output/manifest.json
            ${{ runner.temp }}/native-interop-writer-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/output/diagnostics/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-full-sdk-native-${{ matrix.mode }}
          path: zig/bench/results/full-sdk-${{ matrix.mode }}/
          if-no-files-found: warn

  # Separate fresh VM per trial. Compiler-pair positions rotate; prerequisites remain fixed first.
  cold-full-feature:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && (github.event_name == 'workflow_dispatch' && inputs.cold_full_feature && !inputs.svm_prerequisites)) }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 300
    env:
      COLD_EVIDENCE: /tmp/ziggy-cold-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.trial }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - trial: 1
            order: rust-safe-fast
          - trial: 2
            order: safe-fast-rust
          - trial: 3
            order: fast-rust-safe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check cold ownership and generated-binding regression controls
        run: python3 -B zig/bench/build_matrix_test.py
      - name: Stage compiler and exact dependency sources outside timers
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake libclang-dev libcurl4-openssl-dev libpq-dev libssl-dev libudev-dev make pkg-config protobuf-compiler python3
          rustup toolchain install 1.98.0 --profile minimal
          ZIG="$(python3 zig/tools/bootstrap.py)"
          echo "ZIG=$ZIG" >> "$GITHUB_ENV"
          python3 zig/tools/fixture_pack.py restore-locks
          python3 zig/tools/native_deps.py --restore-only
          python3 zig/src/net/native-url/locked.py --restore-only
          python3 zig/src/starknet/testing/locked.py --restore-only
          python3 zig/src/aleo/testing/locked.py --restore-only
          python3 zig/src/ops/tools/locked.py --restore-only
          for manifest in rust/main/Cargo.toml zig/native/rocks/Cargo.toml zig/src/net/native-url/Cargo.toml zig/src/ops/regex-native/Cargo.toml zig/src/starknet/native-crypto/Cargo.toml zig/src/aleo/native-crypto/Cargo.toml zig/src/aleo/native-vm/Cargo.toml; do
            cargo +1.98.0 fetch --locked --manifest-path "$manifest"
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          mkdir -p "$COLD_EVIDENCE/setup"
          { uname -a; lscpu; df -B1 . "$RUNNER_TEMP"; free -b; rustc +1.98.0 -vV; cargo +1.98.0 -V; "$ZIG" version; clang --version; cmake --version; protoc --version; } > "$COLD_EVIDENCE/setup/platform.txt"
          sha256sum "$ZIG" zig/bench/build_matrix.py zig/bench/cold_matrix_owner.py zig/bench/cache_reclaim.py > "$COLD_EVIDENCE/setup/runner-inputs.sha256"
          dpkg-query -W > "$COLD_EVIDENCE/setup/system-packages.txt"
      - name: Require forty GiB AFTER staging and record exact native runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, shutil
          roots=[pathlib.Path.cwd(),pathlib.Path(os.environ['RUNNER_TEMP'])]
          records=[{'path':str(p),'device':p.stat().st_dev,'free_bytes':shutil.disk_usage(p).free}for p in roots]
          (pathlib.Path(os.environ['COLD_EVIDENCE'])/'setup/capacity.json').write_text(json.dumps(records,indent=2)+'\n')
          assert all(r['free_bytes']>=40*1024**3 for r in records)
          PYTHON
          LIBPQ="$(readlink -f "$(pkg-config --variable=libdir libpq)/libpq.so.5")"
          echo "LIBPQ=$LIBPQ" >> "$GITHUB_ENV"
          TRIAL_ROOT="$RUNNER_TEMP/ziggy-cold-trial-${{ matrix.trial }}"
          echo "TRIAL_ROOT=$TRIAL_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "$TRIAL_ROOT/cache/native-sdk/libziggy_rocks_abi.a" "$TRIAL_ROOT/cache/native-sdk/librocksdb.a" "$TRIAL_ROOT/cache/native-sdk/libsnappy.a" "$TRIAL_ROOT/cache/native-sdk/liblz4.a" "$TRIAL_ROOT/cache/native-sdk/libzstd.a" "$TRIAL_ROOT/cache/native-sdk/libz.a" "$TRIAL_ROOT/cache/native-sdk/libbz2.a" > "$COLD_EVIDENCE/setup/planned-seven-archives.txt"
          sha256sum "$LIBPQ" "$(readlink -f "$(c++ -print-file-name=libstdc++.so)")" "$(readlink -f "$(c++ -print-file-name=libgcc_s.so.1)")" > "$COLD_EVIDENCE/setup/runtime-inputs.sha256"
      - name: Run guarded full-feature cold and no-change trial
        timeout-minutes: 245
        shell: bash
        run: |
          set -euo pipefail
          python3 zig/bench/cold_matrix_owner.py --root "$TRIAL_ROOT" --compiler "$ZIG" --native-db-libs-file "$COLD_EVIDENCE/setup/planned-seven-archives.txt" --libpq-library "$LIBPQ" --git-sha "$GITHUB_SHA" --comparison-order '${{ matrix.order }}'
      - name: Preserve all measurements and failed guards, excluding compiler caches
        if: always()
        shell: bash
        env:
          PRIMARY_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$COLD_EVIDENCE/setup" "$COLD_EVIDENCE/trial"
          if [ -d "${TRIAL_ROOT:-/nonexistent}" ]; then
            for file in owner-result.json matrix.log; do
              if [ -f "$TRIAL_ROOT/$file" ]; then cp "$TRIAL_ROOT/$file" "$COLD_EVIDENCE/trial/"; fi
            done
            if [ -d "$TRIAL_ROOT/matrix" ]; then cp -a "$TRIAL_ROOT/matrix" "$COLD_EVIDENCE/trial/"; fi
          fi
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          base=pathlib.Path(os.environ['COLD_EVIDENCE'])
          rows=[]
          for name,argv in [('head',['git','rev-parse','HEAD']),('diff',['git','diff','--quiet']),('status',['git','status','--porcelain','--untracked-files=all'])]:
              try:
                  result=subprocess.run(argv,capture_output=True,text=True,timeout=10)
                  rows.append({'name':name,'argv':argv,'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr,'actual_parent_wait':True})
              except (OSError,subprocess.TimeoutExpired) as error:
                  rows.append({'name':name,'error_type':type(error).__name__})
          clean=all(r.get('exit_code')==0 for r in rows) and not next((r.get('stdout','').strip() for r in rows if r['name']=='status'),'')
          record={'primary_job_status_before_collection':os.environ['PRIMARY_JOB_STATUS'],'artifact_collection_completed':True,'postflight_Source_clean':clean,'readbacks':rows,'timing_acceptance':False}
          (base/'collection-result.json').write_text(json.dumps(record,indent=2)+'\n')
          hashes=[]
          for path in sorted(base.rglob('*')):
              if path.name=='evidence.sha256':
                  continue
              if path.is_symlink():
                  raise RuntimeError('Unexpected artifact symlink')
              if path.is_file():
                  digest=hashlib.sha256()
                  with path.open('rb') as stream:
                      for chunk in iter(lambda:stream.read(1024*1024),b''):
                          digest.update(chunk)
                  hashes.append(digest.hexdigest()+'  '+str(path.relative_to(base)))
          (base/'evidence.sha256').write_text('\n'.join(hashes)+'\n')
          if os.environ['PRIMARY_JOB_STATUS']=='success' and not clean:
              raise SystemExit('Final Source readback failed after evidence was preserved')
          PYTHON
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-cold-full-feature-trial-${{ matrix.trial }}
          path: ${{ env.COLD_EVIDENCE }}/
          if-no-files-found: error

  # Compilation and filtered native fixture controls only; never native cases.
  native-harness-controls:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]')) && (!(github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-svm-prerequisites-only]')) && ((github.event_name != 'workflow_dispatch' || !inputs.svm_prerequisites) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite')))) }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 280
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Bind private native harness root
        run: |
          set -euo pipefail
          echo "NATIVE_HARNESS_ROOT=$RUNNER_TEMP/ziggy-native-harness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
      - name: Stage exact Rust toolchain and helper dependency sources
        timeout-minutes: 45
        run: |
          set -euo pipefail
          test ! -e "$NATIVE_HARNESS_ROOT"
          mkdir -p "$NATIVE_HARNESS_ROOT/evidence/setup" "$NATIVE_HARNESS_ROOT/cargo-home"
          printf '%s\n' "$GITHUB_SHA" > "$NATIVE_HARNESS_ROOT/setup-owned"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake libclang-dev libpq-dev libssl-dev libudev-dev lsof openssl pkg-config protobuf-compiler python3
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          echo "CARGO_HOME=$NATIVE_HARNESS_ROOT/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          CARGO_HOME="$NATIVE_HARNESS_ROOT/cargo-home" cargo +1.98.0 fetch --locked --manifest-path rust/main/Cargo.toml
          python3 zig/tools/fixture_pack.py restore-locks
          python3 zig/reference/native-rows/locked.py --restore-only
          for manifest in zig/reference/rocks/Cargo.toml zig/reference/native-rows/Cargo.toml zig/reference/Cargo.toml; do
            CARGO_HOME="$NATIVE_HARNESS_ROOT/cargo-home" cargo +1.98.0 fetch --locked --manifest-path "$manifest"
          done
          { rustc +1.98.0 -vV; cargo +1.98.0 -V; node --version; python3 --version; uname -a; lscpu; df -B1 "$NATIVE_HARNESS_ROOT"; } > "$NATIVE_HARNESS_ROOT/evidence/setup/tools-platform.txt"
          git diff --exit-code
      - name: Check portable tool ELF and explicit admission guards
        run: python3 zig/bench/native_case_tools_test.py -v
      - name: Compile, test and lint only the native helper controls
        timeout-minutes: 155
        run: python3 zig/bench/native_harness_controls.py --root "$NATIVE_HARNESS_ROOT" --git-sha "$GITHUB_SHA"
      - name: Build Source-pinned native case verifier tools in the same target
        timeout-minutes: 65
        run: python3 zig/bench/native_case_tools.py --root "$NATIVE_HARNESS_ROOT" --git-sha "$GITHUB_SHA" --minutes 60 --execute
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zig-native-case-tools-${{ github.sha }}
          path: ${{ env.NATIVE_HARNESS_ROOT }}/evidence/native-case-tools/
          if-no-files-found: error
      - name: Preserve helper Source, filtered results, products and failure evidence
        if: always()
        env:
          PRIMARY_JOB_STATUS: ${{ job.status }}
        run: |
          export NATIVE_HARNESS_ROOT="${NATIVE_HARNESS_ROOT:-$RUNNER_TEMP/ziggy-native-harness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          echo "NATIVE_HARNESS_ROOT=$NATIVE_HARNESS_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$NATIVE_HARNESS_ROOT/evidence/setup"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['NATIVE_HARNESS_ROOT'])/'evidence'
          (root/'job-status.json').write_text(json.dumps({'primary_job_status':os.environ['PRIMARY_JOB_STATUS'],'native_case_acceptance':False,'timing_acceptance':False})+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zig-native-harness-controls
          path: ${{ env.NATIVE_HARNESS_ROOT }}/evidence/
          if-no-files-found: error

  native-case-producer-inputs:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/zig-agent-rewrite' && contains(github.event.head_commit.message, '[zig-native-case]') }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Check producer provenance and closed-artifact controls
        run: python3 -I -B zig/bench/native_case_ci_test.py -v
      - name: Read exact checked-in native selector without granting case acceptance
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-case-selection"
          python3 - <<'PYTHON'
          import importlib.util, json, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('native_case_ci',Path('zig/bench/native_case_ci.py'))
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          path=Path('zig/bench/native_case_request.json').resolve()
          request=json.loads(path.read_text())
          assert type(request.get('schema')) is int and request['schema']==1 and type(request.get('root_approved')) is bool
          enabled=request['root_approved']
          if enabled: module.validate_request(request)
          receipt={'schema':1,'reviewed_request':module.pin(path),'execution_source_commit':os.environ['GITHUB_SHA'],'producer_download_authorized':enabled,'native_case_acceptance':False,'scope':'Producer-input staging only; actual case requires separate hydration/interop/setup/owned-run evidence.'}
          (Path(os.environ['RUNNER_TEMP'])/'native-case-selection'/'selection.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:output.write('enabled='+str(enabled).lower()+'\n');output.write('sha256='+module.pin(path)['sha256']+'\n')
          PYTHON
      - name: Fetch only the exact completed artifact-producing jobs
        if: steps.request.outputs.enabled == 'true'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA256: ${{ steps.request.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B zig/bench/native_case_ci.py \
            --request "$GITHUB_WORKSPACE/zig/bench/native_case_request.json" \
            --request-sha256 "$REQUEST_SHA256" \
            --execution-source-commit "$GITHUB_SHA" --repo "$GITHUB_WORKSPACE" \
            --gh "$(command -v gh)" \
            --output "$RUNNER_TEMP/native-case-producer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.request.outputs.enabled == 'true'
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: steps.request.outputs.enabled == 'true'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        if: steps.request.outputs.enabled == 'true'
        with:
          version: v1.5.0
      - name: Install explicit native-case host prerequisites (no node/service starts)
        if: steps.request.outputs.enabled == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git jq lsof libpq5 postgresql-client-16 \
            libcurl4t64 libssl3t64 python3-venv
      - name: Check setup and composition controls before any package acquisition
        if: steps.request.outputs.enabled == 'true'
        run: |
          python3 -I -B zig/bench/native_case_setup_test.py -v
          python3 -I -B zig/bench/native_case_run_test.py -v
          python3 -I -B zig/bench/native_case_owner_test.py -v
      - name: Pin preinstalled tools; no CLI/SDK or chain main invoked
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-case-selection"
          python3 - <<'PYTHON'
          import hashlib,json,os,shutil
          from pathlib import Path
          names=['anvil','cast','forge','docker','ps','lsof','node','pnpm','sh','git','ldconfig','curl','jq']
          paths={name:Path(shutil.which(name) or '/absent').resolve(strict=True) for name in names}
          paths['psql']=Path('/usr/lib/postgresql/16/bin/psql').resolve(strict=True)
          rows={}
          for name,path in paths.items():
              assert path.is_file() and not path.is_symlink() and os.access(path,os.X_OK),name
              with path.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
              rows[name]={'path':str(path),'bytes':path.stat().st_size,'sha256':digest}
          target=Path(os.environ['RUNNER_TEMP'])/'native-case-selection'/'preinstalled-tools.json'
          with target.open('x') as stream:json.dump(rows,stream,indent=2);stream.write('\n')
          PYTHON
      - name: Hydrate, stage prerequisites, prove interoperability, then run one owned native case
        if: steps.request.outputs.enabled == 'true'
        timeout-minutes: 142
        env:
          REQUEST_SHA256: ${{ steps.request.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          PRODUCER="$RUNNER_TEMP/native-case-producer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/producer-receipt.json"
          TOOLS="$RUNNER_TEMP/native-case-selection/preinstalled-tools.json"
          PRODUCER_SHA="$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$PRODUCER")"
          TOOLS_SHA="$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$TOOLS")"
          exec env -i PATH=/usr/local/bin:/usr/bin:/bin LC_ALL=C.UTF-8 GITHUB_ACTIONS=true \
            python3 -I -B zig/bench/native_case_run.py --execute \
            --request "$GITHUB_WORKSPACE/zig/bench/native_case_request.json" --request-sha256 "$REQUEST_SHA256" \
            --producer-receipt "$PRODUCER" --producer-receipt-sha256 "$PRODUCER_SHA" \
            --tools "$TOOLS" --tools-sha256 "$TOOLS_SHA" \
            --execution-source-commit "$GITHUB_SHA" --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/native-case-composition-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --case-root "/tmp/znc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: native-case-producer-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/native-case-selection/selection.json
            ${{ runner.temp }}/native-case-producer-${{ github.run_id }}-${{ github.run_attempt }}/producer-receipt.json
