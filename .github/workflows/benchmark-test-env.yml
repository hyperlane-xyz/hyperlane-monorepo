name: benchmark-test-env
on:
  workflow_call:
    inputs:
      skip_ts:
        type: string
env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_API: https://cache.depot.dev
  TURBO_TOKEN: ${{ secrets.DEPOT_TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.DEPOT_ORG_ID }}
jobs:
  env-test-matrix:
    runs-on: ubuntu-24.04
    if: inputs.skip_ts != 'true'
    env:
      MAINNET3_ARBITRUM_RPC_URLS: ${{ secrets.MAINNET3_ARBITRUM_RPC_URLS }}
      MAINNET3_OPTIMISM_RPC_URLS: ${{ secrets.MAINNET3_OPTIMISM_RPC_URLS }}
      MAINNET3_ETHEREUM_RPC_URLS: ${{ secrets.MAINNET3_ETHEREUM_RPC_URLS }}
      TESTNET4_SEPOLIA_RPC_URLS: ${{ secrets.TESTNET4_SEPOLIA_RPC_URLS }}
      BENCHMARK_CONTEXT: benchmark-test-env.yml:env-test-matrix:${{ strategy.job-index }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment:
          - mainnet3
        chain:
          - ethereum
          - arbitrum
          - optimism
        module:
          - core
          - igp
        include:
          - environment: testnet4
            chain: sepolia
            module: core
    steps:
      - name: Benchmark runner resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
          context="bench-res:$BENCHMARK_CONTEXT" -f description="cpus=$(nproc)
          mem=$(free -b | awk '/^Mem:/ {print $2}')"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: pnpm-build
        uses: ./.depot/actions/pnpm-build-with-cache
        with:
          build-filter: '@hyperlane-xyz/infra...'
      - name: Checkout registry
        uses: ./.depot/actions/checkout-registry
      - name:
          Fork test ${{ matrix.environment }} ${{ matrix.module }} ${{ matrix.chain
          }} deployment with retries
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 30
          command:
            cd typescript/infra && ./fork.sh ${{ matrix.environment }} ${{
            matrix.module }} ${{ matrix.chain }}
          on_retry_command: |
            echo "Test failed, waiting before retry..."
  env-test:
    runs-on: ubuntu-24.04
    needs: env-test-matrix
    if: always()
    steps:
      - name: Benchmark runner resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f
          context="bench-res:$BENCHMARK_CONTEXT" -f description="cpus=$(nproc)
          mem=$(free -b | awk '/^Mem:/ {print $2}')"
      - uses: actions/checkout@v7
      - name: Check env-test matrix status
        uses: ./.depot/actions/check-job-status
        with:
          job_name: Env Test
          result: ${{ needs.env-test-matrix.result }}
    env:
      BENCHMARK_CONTEXT: benchmark-test-env.yml:env-test:0
permissions:
  contents: read
  statuses: write
  pull-requests: read
  checks: read
