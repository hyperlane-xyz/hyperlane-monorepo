# Table fields are the source for SQL allowlists and generated filter/order/cursor types.
directive @cached(ttl: Int, refresh: Boolean) on QUERY

extend type query_root {
  message_view_aggregate(
    where: message_view_bool_exp
    order_by: [message_view_order_by!]
    limit: Int
    offset: Int
    distinct_on: [message_view_select_column!]
  ): message_view_aggregate!
}

type message_view_aggregate {
  aggregate: message_view_aggregate_fields
  nodes: [message_view!]!
}

type message_view_aggregate_fields {
  count(columns: [message_view_select_column!], distinct: Boolean): Int!
}

schema {
  query: query_root
}

scalar bigint

scalar bytea

scalar interval

scalar numeric

scalar timestamp

type query_root {
  "fetch data from the table: \"domain\""
  domain(
    "filter the rows returned"
    where: domain_bool_exp
    "sort the rows by one or more columns"
    order_by: [domain_order_by!]
    "limit the number of rows returned"
    limit: Int
    "skip the first n rows. Use only with order_by"
    offset: Int
    "distinct select on columns"
    distinct_on: [domain_select_column!]
  ): [domain!]!
  "fetch data from the table: \"domain\" using primary key columns"
  domain_by_pk(id: Int!): domain
  "fetch data from the table: \"message_view\""
  message_view(
    "number of blocks behind each chain head; omit for canonical scraper finality"
    confirmations: Int
    "filter the rows returned"
    where: message_view_bool_exp
    "sort the rows by one or more columns"
    order_by: [message_view_order_by!]
    "limit the number of rows returned"
    limit: Int
    "cursor to continue an ordered query"
    cursor: [message_view_stream_cursor_input!]
    "skip the first n rows. Use only with order_by"
    offset: Int
    "distinct select on columns"
    distinct_on: [message_view_select_column!]
  ): [message_view!]
  "fetch data from the table: \"raw_message_dispatch\""
  raw_message_dispatch(
    "filter the rows returned"
    where: raw_message_dispatch_bool_exp
    "sort the rows by one or more columns"
    order_by: [raw_message_dispatch_order_by!]
    "limit the number of rows returned"
    limit: Int
    "skip the first n rows. Use only with order_by"
    offset: Int
    "distinct select on columns"
    distinct_on: [raw_message_dispatch_select_column!]
  ): [raw_message_dispatch!]!
  "fetch data from the table: \"raw_message_dispatch\" using primary key columns"
  raw_message_dispatch_by_pk(id: bigint!): raw_message_dispatch
}

"columns and relationships of \"domain\""
type domain {
  chain_id: bigint
  id: Int!
  is_deprecated: Boolean!
  is_test_net: Boolean!
  name: String!
  native_token: String!
  time_created: timestamp!
  time_updated: timestamp!
}

