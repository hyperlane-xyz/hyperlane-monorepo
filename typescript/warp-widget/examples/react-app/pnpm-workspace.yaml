# Isolates this example from the parent monorepo workspace.
# Without this, pnpm resolves deps from the monorepo root instead of locally.
packages: []
allowBuilds:
  esbuild: true
overrides:
  # oxfmt pins tinypool 2.1.0; 2.1.2 fixes GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr.
  tinypool@2: ^2.1.2
