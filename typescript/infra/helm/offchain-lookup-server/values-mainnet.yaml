environment: mainnet

# General deployment configuration
image:
  repository: ghcr.io/hyperlane-xyz/hyperlane-node-services
  # Modify this tag to deploy a new revision.
  # Images can be found here:
  # https://github.com/orgs/hyperlane-xyz/packages/container/package/hyperlane-node-services
  tag: b172535-20261021-235950

# In Google Cloud Secret Manager, all secrets need to have a certain prefix in order to be accessible by
# the Cluster Secret Store. For testnet this prefix is "hyperlane-testnet4"
secrets:
  prefix: 'hyperlane-mainnet3'

ingress:
  host: offchain-lookup.services.hyperlane.xyz
  # This needs to be created/looked up in Google Cloud Console
  staticIpName: offchain-lookup-server-mainnet

env:
  # Primary, RC, and fastpath EVM identities; shared by both CCS read APIs.
  - name: CCS_AUTHORIZED_SIGNERS
    value: '["0x74cae0ecc47b02ed9b9d32e000fd70b9417970c5", "0x09b96417602ed6ac76651f7a8c4860e60e3aa6d0", "0x1e100476e9360b11a592eafe1c90328368e547b6"]'
  - name: ENABLED_MODULES
    value: 'cctp,callCommitments'
  - name: HYPERLANE_EXPLORER_URL
    value: 'https://api.hyperlane.xyz/v1/graphql'
  - name: CCTP_ATTESTATION_URL
    value: 'https://iris-api.circle.com'
  - name: SERVER_PORT
    value: '3000'
  - name: REGISTRY_URI
    value: 'https://github.com/hyperlane-xyz/hyperlane-registry/tree/cc6aa9cf28b2b4051308c4254ee3659e2051258d'
  - name: SERVER_BASE_URL
    value: 'https://offchain-lookup.services.hyperlane.xyz'
