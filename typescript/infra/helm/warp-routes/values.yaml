image:
  repository: ghcr.io/hyperlane-xyz/hyperlane-node-services
  tag:
serviceName: warp-monitor
hyperlane:
  runEnv: mainnet3
  context: hyperlane
  chains: []
  registryUri: ''
nameOverride: ''
fullnameOverride: ''
# Centralized multi-route monitor: one long-running Deployment that monitors
# many routes at once, instead of a StatefulSet per route. When enabled, the
# per-route StatefulSet is not rendered.
centralized:
  enabled: false
  # Monitor every route in the registry. When false, warpRouteIds is used.
  warpRouteAll: true
  # Explicit route IDs to monitor when warpRouteAll is false.
  warpRouteIds: []
  # Max routes processed concurrently per cycle.
  concurrency: 10
  # Routes whose shared balance metrics are emitted by a rebalancer and must not
  # be double-emitted by this monitor.
  skipSharedBalanceWarpRouteIds: []
  explorerApiUrl: ''
  explorerQueryLimit: 200
  inventoryAddress: ''
  checkFrequency: 30000
  # Guaranteed QoS (requests == limits) so the pod is not evicted under node
  # memory pressure. One process covers the whole fleet, so size accordingly.
  resources:
    cpu: '1'
    memory: 4Gi
externalSecrets:
  clusterSecretStore:
