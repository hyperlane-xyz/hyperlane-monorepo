# Reject packages published less than 7 days ago (supply chain protection)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@hyperlane-xyz/*'
  - '@provablehq/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - oxfmt
  - oxlint
  - zod@4.5.2

packages:
  - 'solhint-plugin'
  - 'solidity'
  - 'typescript/*'
  - 'starknet'

# Require catalog: protocol for all cataloged dependencies
catalogMode: strict

# Shared dependency versions for consistent versioning across all packages.
# Use `catalog:` in package.json to reference these versions.
# See: https://pnpm.io/catalogs
catalog:
  # === Production dependencies ===

  # Ethereum/EVM
  ethers: ^5.8.0
  viem: ^2.21.45
  zksync-ethers: ^5.10.0

  # Logging
  pino: ^8.19.0
  pino-pretty: ^13.0.0
  '@google-cloud/pino-logging-gcp-config': ^1.3.5

  # Validation
  zod: ^4.5.2

  # HTTP
  express-rate-limit: ^8.3.1
  '@as-integrations/express5': ^1.1.2
  '@apollo/server': ^5.5.0
  '@nestjs/apollo': 13.2.3
  '@nestjs/common': 11.1.28
  '@nestjs/core': 11.1.28
  '@nestjs/graphql': 13.2.3
  '@nestjs/platform-express': 11.1.28
  graphql: ^16.14.2
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2

  # Utilities
  bignumber.js: ^9.1.1
  bs58: ^6.0.0
  yaml: 2.4.5
  lodash-es: ^4.17.21
  borsh: ^0.7.0
  compare-versions: ^6.1.1
  dotenv: ^10.0.0
  asn1.js: ^5.4.1
  uuid: ^10.0.0

  # Starknet
  starknet: ^7.4.0
  '@starknet-react/chains': ^3.1.2

  # Cosmos
  '@cosmjs/amino': ^0.32.4
  '@cosmjs/cosmwasm-stargate': ^0.32.4
  '@cosmjs/crypto': ^0.32.4
  '@cosmjs/encoding': ^0.32.4
  '@cosmjs/math': ^0.32.4
  '@cosmjs/proto-signing': ^0.32.4
  '@cosmjs/stargate': ^0.32.4
  '@cosmjs/tendermint-rpc': ^0.32.4
  '@chain-registry/types': ^0.50.122
  cosmjs-types: ^0.9.0

  # Solana
  '@solana/kit': ^6.1.0
  '@solana/web3.js': ^1.98.4
  '@solana/spl-token': ^0.4.9

  # Radix
  '@radixdlt/babylon-gateway-api-sdk': ^1.10.1

  # Tron
  tronweb: ^6.1.1
  '@tronweb3/tronwallet-abstract-adapter': ^1.1.10
  '@tronweb3/tronwallet-adapter-react-hooks': ^1.1.11
  '@tronweb3/tronwallet-adapter-tronlink': ^1.1.13
  '@tronweb3/tronwallet-adapters': ^1.2.21

  # AWS
  '@aws-sdk/client-s3': ^3.577.0
  '@aws-sdk/client-kms': ^3.577.0

  # Registry
  '@hyperlane-xyz/registry': 25.3.0

  # CLI prompts
  '@inquirer/prompts': 3.3.2
  '@inquirer/select': ^1.0.0

  # Optimism
  '@eth-optimism/sdk': ^3.3.3

  # Arbitrum
  '@arbitrum/sdk': ^4.0.0

  # LiFi (cross-chain bridging)
  '@lifi/sdk': ^3.15.4

  # Safe
  '@safe-global/api-kit': 4.2.0
  '@safe-global/protocol-kit': 7.2.0
  '@safe-global/safe-deployments': 1.37.60
  '@safe-global/types-kit': 3.1.0

  # Turnkey
  '@turnkey/api-key-stamper': ^0.5.0
  '@turnkey/http': 3.15.0
  '@turnkey/sdk-server': 4.12.0
  # 1.1.13+ switched to @turnkey/sdk-server 7; upgrade the Turnkey stack together.
  '@turnkey/solana': 1.1.12

  # Prometheus
  prom-client: ^14.0.1

  # === Development dependencies ===

  # Build tools
  '@typescript/native': npm:typescript@7.0.2
  typescript: npm:@typescript/typescript6@6.0.2
  tsx: ^4.23.1
  ts-node: ^10.9.2
  '@vercel/ncc': ^0.38.3

  # Linting
  oxlint: ^1.77.0
  oxlint-tsgolint: ^7.0.2001

  # Formatting
  oxfmt: ^0.62.0
  prettier: ^3.9.6
  prettier-plugin-solidity: ^1.4.2

  # Testing
  c8: ^10.1.3
  mocha: ^11.7.6
  mocha-steps: ^1.3.0
  chai: ^4.5.0
  chai-as-promised: ^8.0.1
  sinon: ^13.0.2
  testcontainers: 11.12.0

  # Type definitions
  '@types/mocha': ^10.0.1
  '@types/node': ^26.1.2
  '@types/sinon': ^17.0.1
  '@types/sinon-chai': ^3.2.12
  '@types/chai': ^4.3.11
  '@types/chai-as-promised': ^8
  '@types/lodash-es': ^4.17.12
  '@types/yargs': ^17.0.24
  '@types/ws': ^8.5.5
  '@types/uuid': ^10.0.0
  '@types/bs58': ^5.0.0

  # Hardhat
  hardhat: ^2.22.2
  '@nomiclabs/hardhat-ethers': ^2.2.3
  '@nomiclabs/hardhat-waffle': ^2.0.6
  ethereum-waffle: ^4.0.10
  hardhat-gas-reporter: ^1.0.9
  solidity-coverage: ^0.8.3

  # Solidity
  solhint: ^5.0.5
  solhint-plugin-prettier: ^0.1.0
  typechain: 8.3.2
  '@typechain/ethers-v5': ^11.1.2
  '@typechain/ethers-v6': ^0.5.1
  '@typechain/hardhat': ^9.1.0

  # OpenZeppelin
  '@openzeppelin/contracts': ^4.9.3
  '@openzeppelin/contracts-upgradeable': ^4.9.3

  # Other dev tools
  yargs: ^17.7.2
  chalk: ^5.3.0
  # 7.9 pulls React 19 types into the React 18 widget build.
  '@prisma/adapter-pg': 7.8.0
  '@prisma/client': 7.8.0
  prisma: 7.8.0
overrides:
  # 0.11.6 requires 18 consensus heights; current Aleo E2E networks provide 17.
  '@provablehq/wasm': 0.11.3
  '@types/react': 18.3.27
  '@types/react-dom': 18.3.7
  async: ^2.6.4
  fetch-ponyfill: ^7.1
  flat: ^5.0.2
  globals: ^16.3.0
  lodash: ^4.17.21
  react: 18.3.1
  react-dom: 18.3.1
  recursive-readdir: ^2.2.3
  underscore: ^1.13
  undici: ^5.11
  '@babel/parser': ^7.22.7
  '@typechain/ethers-v5': 11.1.2
  xmlhttprequest-ssl: 4.0.0
packageExtensions:
  # Registry exports Pino types but currently lists Pino only as a dev dependency.
  '@hyperlane-xyz/registry@*':
    dependencies:
      pino: ^8.21.0
patchedDependencies:
  typechain@8.3.2: patches/typechain@8.3.2.patch
  node-fetch@2.7.0: patches/node-fetch@2.7.0.patch
  bigint-buffer@1.1.5: patches/bigint-buffer@1.1.5.patch
  node-fetch@3.3.2: patches/node-fetch@3.3.2.patch
allowBuilds:
  '@apollo/protobufjs': true
  '@prisma/engines': true
  '@reown/appkit': true
  '@trufflesuite/bigint-buffer': true
  bigint-buffer: true
  bufferutil: true
  cbor-extract: true
  core-js: true
  core-js-pure: true
  cpu-features: true
  esbuild: true
  keccak: true
  node-hid: true
  prisma: true
  protobufjs: true
  secp256k1: true
  sharp: true
  ssh2: true
  tiny-secp256k1: true
  usb: true
  utf-8-validate: true
  workerd: true
