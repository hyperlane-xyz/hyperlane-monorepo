[package]
name = "relayer-merkle-replay-benchmark"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# Keep this small replay harness independent of the full agent workspace.
[workspace]

[dependencies]
eyre = "=0.6.8"
hyperlane-core = { path = "../../../rust/main/hyperlane-core", default-features = false, features = ["strum"] }
rand = "0.8.5"
sha3 = "0.10"
thiserror = "1.0"
tracing = "0.1"

[profile.release]
debug = 0
strip = "debuginfo"

[lib]
doctest = false
