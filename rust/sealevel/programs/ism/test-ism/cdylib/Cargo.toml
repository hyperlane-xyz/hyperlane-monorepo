[package]
name = "hyperlane-sealevel-test-ism-cdylib"
version = "0.1.0"
edition = "2021"

# Deployable ELF. Kept apart from the `lib` crate because cargo skips LTO for
# packages that build both cdylib and rlib.
[lib]
name = "hyperlane_sealevel_test_ism"
crate-type = ["cdylib"]

[dependencies]
program = { package = "hyperlane-sealevel-test-ism", path = ".." }
