[package]
name = "hyperlane-sealevel-interface"
version = "0.1.0"
edition = "2021"
description = "Off-chain interface (instructions, accounts, PDA seeds, errors) for the Hyperlane Sealevel programs"

[features]
serde = ["dep:serde"]

[dependencies]
borsh.workspace = true
num-derive.workspace = true
num-traits.workspace = true
serde = { workspace = true, optional = true }
solana-program.workspace = true
solana-sdk-ids.workspace = true
solana-system-interface.workspace = true
thiserror.workspace = true

access-control = { path = "../libraries/access-control" }
account-utils = { path = "../libraries/account-utils" }
hyperlane-core = { path = "../../main/hyperlane-core" }
hyperlane-sealevel-interchain-security-module-interface = { path = "../libraries/interchain-security-module-interface" }
multisig-ism = { path = "../libraries/multisig-ism" }
quote-verifier = { path = "../libraries/quote-verifier" }

[dev-dependencies]
hyperlane-sealevel-interface-goldens = { path = "goldens" }
hyperlane-sealevel-message-recipient-interface = { path = "../libraries/message-recipient-interface" }
serializable-account-meta = { path = "../libraries/serializable-account-meta" }
