cargo-features = ["workspace-inheritance"]

[package]
name = "hyperlane-warp-route"
documentation = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license-file = { workspace = true }
publish = { workspace = true }
# Linked into Sealevel programs: the crate version feeds Rust symbol disambiguators,
# so inheriting the agent release version would change embedded program ELFs.
# Only change this together with `program:generate` in typescript/svm-sdk.
version = "2.3.0"

[dependencies]
hyperlane-core = { path = "../../hyperlane-core" }
