{{- if and .Values.hyperlane.scraper.enabled .Values.hyperlane.scraper.websocketConfigSecret }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agent-common.fullname" . }}-scraper3-websocket
  labels:
    {{- include "agent-common.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ include "agent-common.secret-store.name" . }}
    kind: {{ .Values.externalSecrets.storeType }}
  refreshInterval: "1h"
  target:
    name: {{ include "agent-common.fullname" . }}-scraper3-websocket
  data:
  - secretKey: websocket-config.json
    remoteRef:
      key: {{ .Values.hyperlane.scraper.websocketConfigSecret | quote }}
{{- end }}
