{{- if .Values.hyperlane.validator.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "validator.fullname" . }}-external-secret
  labels:
    {{- include "agent-common.labels" . | nindent 4 }}
  annotations:
    update-on-redeploy: "{{ now }}"
spec:
  secretStoreRef:
    name: {{ include "agent-common.secret-store.name" . }}
    kind: {{ .Values.externalSecrets.storeType }}
  refreshInterval: "1h"
  # The secret that will be created
  target:
    name: {{ include "validator.fullname" . }}-secret
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "agent-common.labels" . | nindent 10 }}
      data:
{{ $index := 0 }}
{{- range .Values.hyperlane.validator.configs }}
        validator-{{ $index }}.env: |
          {{- if eq .validator.type "hexKey" }}
          HYP_VALIDATOR_KEY={{ printf "'{{ .signer_key_%d | toString }}'" $index }}
          {{- end }}
          {{- if eq .checkpointSyncer.type "s3" }}
          AWS_ACCESS_KEY_ID={{ printf "'{{ .aws_access_key_id_%d | toString }}'" $index }}
          AWS_SECRET_ACCESS_KEY={{ printf "'{{ .aws_secret_access_key_%d | toString }}'" $index }}
          {{- end }}

          {{- if eq .chainSigner.type "hexKey" }}
          HYP_CHAINS_{{ .originChainName | upper }}_SIGNER_KEY={{ printf "'{{ .signer_key_%d | toString }}'" $index }}
          {{- end }}
          {{- if eq .chainSigner.type "cosmosKey" }}
          HYP_CHAINS_{{ .originChainName | upper }}_SIGNER_KEY={{ printf "'{{ .signer_key_%d | toString }}'" $index }}
          {{- end }}
          {{- if eq .chainSigner.type "starkKey" }}
          HYP_CHAINS_{{ .originChainName | upper }}_SIGNER_KEY={{ printf "'{{ .chain_signer_key_%d | toString }}'" $index }}
          HYP_CHAINS_{{ .originChainName | upper }}_SIGNER_ADDRESS={{ printf "'{{ .chain_signer_address_%d | toString }}'" $index }}
          HYP_CHAINS_{{ .originChainName | upper }}_SIGNER_LEGACY="{{ .chainSigner.legacy }}"
          {{- end }}
{{ $index = add1 $index }}
{{- end }}
{{- /*
  Built up as a list rather than emitted as raw YAML list items directly:
  when no validator index needs any external secret (e.g. an all-GCP-KMS
  release), a directly-emitted range produces no items at all, which Helm
  renders as `data:` followed by nothing (null) rather than `data: []` —
  and the ExternalSecret CRD schema requires spec.data to be an array.
  toYaml of an empty list correctly renders `[]`.
*/}}
{{- $dataEntries := list }}
{{- $index := 0 }}
{{- range .Values.hyperlane.validator.configs }}
{{- if eq .chainSigner.type "hexKey" }}
{{- $dataEntries = append $dataEntries (dict "secretKey" (printf "signer_key_%d" $index) "remoteRef" (dict "key" (printf "%s-%s-key-%s-validator-%d" $.Values.hyperlane.context $.Values.hyperlane.runEnv .originChainName $index) "property" "privateKey")) }}
{{- end }}
{{- if eq .chainSigner.type "cosmosKey" }}
{{- $dataEntries = append $dataEntries (dict "secretKey" (printf "signer_key_%d" $index) "remoteRef" (dict "key" (printf "%s-%s-key-%s-validator-%d" $.Values.hyperlane.context $.Values.hyperlane.runEnv .originChainName $index) "property" "privateKey")) }}
{{- end }}
{{- if eq .chainSigner.type "starkKey" }}
{{- $dataEntries = append $dataEntries (dict "secretKey" (printf "chain_signer_key_%d" $index) "remoteRef" (dict "key" (printf "%s-%s-key-%s-validator-%d" $.Values.hyperlane.context $.Values.hyperlane.runEnv .originChainName $index) "property" "privateKey")) }}
{{- $dataEntries = append $dataEntries (dict "secretKey" (printf "chain_signer_address_%d" $index) "remoteRef" (dict "key" (printf "%s-%s-key-%s-validator-%d" $.Values.hyperlane.context $.Values.hyperlane.runEnv .originChainName $index) "property" "address")) }}
{{- end }}
{{- if eq .checkpointSyncer.type "s3" }}
{{- $dataEntries = append $dataEntries (dict "secretKey" (printf "aws_access_key_id_%d" $index) "remoteRef" (dict "key" (printf "%s-%s-%s-validator-%d-aws-access-key-id" $.Values.hyperlane.context $.Values.hyperlane.runEnv .originChainName $index))) }}
{{- $dataEntries = append $dataEntries (dict "secretKey" (printf "aws_secret_access_key_%d" $index) "remoteRef" (dict "key" (printf "%s-%s-%s-validator-%d-aws-secret-access-key" $.Values.hyperlane.context $.Values.hyperlane.runEnv .originChainName $index))) }}
{{- end }}
{{ $index = add1 $index }}
{{- end }}
{{- if $dataEntries }}
  data:
{{ toYaml $dataEntries | indent 2 }}
{{- else }}
  data: []
{{- end }}
{{- end }}
