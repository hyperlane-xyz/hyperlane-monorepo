{{- if .Values.hyperlane.scraper.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agent-common.fullname" . }}-scraper3
  labels:
    {{- include "agent-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: scraper3
spec:
  selector:
    matchLabels:
      {{- include "agent-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scraper3
  replicas: 1
  serviceName: {{ include "agent-common.fullname" . }}-scraper3
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/external-secret: {{ include (print $.Template.BasePath "/external-secret.yaml") . | sha256sum }}
        checksum/scraper-external-secret: {{ include (print $.Template.BasePath "/scraper-external-secret.yaml") . | sha256sum }}
        {{- if .Values.hyperlane.scraper.proxy.enabled }}
        checksum/scraper-proxy-cloudflared-external-secret: {{ include (print $.Template.BasePath "/scraper-proxy-cloudflared-external-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.hyperlane.scraper.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agent-common.labels" . | nindent 8 }}
        app.kubernetes.io/component: scraper3
        {{- with .Values.podCommonLabels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.hyperlane.scraper.podLabels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: agent
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["./scraper"]
        envFrom:
        - configMapRef:
            name: {{ include "agent-common.fullname" . }}
        - secretRef:
            name: {{ include "agent-common.fullname" . }}-secret
        - secretRef:
            name: {{ include "agent-common.fullname" . }}-scraper3-secret
        env:
        {{- include "agent-common.config-env-vars" (dict "config" .Values.hyperlane.scraper.config) | nindent 8 }}
        - name: HYP_CHAINS_ETHEREUM_BLOCKS_REORGPERIOD
          value: "1"
        resources:
          {{- toYaml .Values.hyperlane.scraper.resources | nindent 10 }}
        ports:
        - name: metrics
          containerPort: {{ .Values.hyperlane.metrics.port }}
      {{- if .Values.hyperlane.scraper.proxy.enabled }}
      - name: scraper-proxy
        image: "{{ .Values.hyperlane.scraper.proxy.docker.repository }}:{{ .Values.hyperlane.scraper.proxy.docker.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SERVICE_NAME
          value: scraper-proxy
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "agent-common.fullname" . }}-scraper3-secret
              key: DATABASE_URL
        - name: PORT
          value: {{ .Values.hyperlane.scraper.proxy.port | quote }}
        ports:
        - name: scraper-proxy
          containerPort: {{ .Values.hyperlane.scraper.proxy.port }}
        readinessProbe:
          tcpSocket:
            port: scraper-proxy
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.hyperlane.scraper.proxy.resources | nindent 10 }}
      - name: cloudflared
        image: {{ .Values.hyperlane.scraper.proxy.tunnel.image }}
        args: ["tunnel", "--no-autoupdate", "run"]
        envFrom:
        - secretRef:
            name: {{ include "agent-common.fullname" . }}-scraper-proxy-cloudflared-secret
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "scraper"
          effect: "NoSchedule"
{{- end }}
