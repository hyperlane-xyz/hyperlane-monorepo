[package]
name = "hyperlane-ethereum"
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
# Main block
async-trait.workspace = true
dashmap.workspace = true
derive-new.workspace = true
ethers-contract.workspace = true
ethers-core.workspace = true
ethers-signers.workspace = true
ethers.workspace = true
eyre.workspace = true
futures-util.workspace = true
google-cloud-kms-v1.workspace = true
hex.workspace = true
hex-literal.workspace = true
itertools.workspace = true
# Deliberately a second, independent k256 (0.13.4) alongside the one `ethers-core`
# pins internally for `AwsSigner` (an old, incompatible version) - the two never
# need to interconvert, since only the final (r, s, v) ethers::types::Signature
# crosses between GcpSigner and the rest of this crate. See gcp.rs's test module
# comment for where this surfaces during testing.
k256 = { workspace = true, features = ["pem"] }
num.workspace = true
num-traits.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing-futures.workspace = true
tracing.workspace = true
url.workspace = true

ethers-prometheus = { path = "../../ethers-prometheus", features = ["serde"] }
hyperlane-core = { path = "../../hyperlane-core", features = ["async"] }
hyperlane-metric = { path = "../../hyperlane-metric" }
hyperlane-operation-verifier = { path = "../../applications/hyperlane-operation-verifier" }
hyperlane-warp-route = { path = "../../applications/hyperlane-warp-route" }
reqwest-utils = { path = "../../utils/reqwest-utils" }

[build-dependencies]
abigen = { path = "../../utils/abigen", features = ["ethers"] }
hyperlane-core = { path = "../../hyperlane-core", features = ["test-utils"] }

[dev-dependencies]
tracing-test.workspace = true

[features]
default = []
test-utils = []
