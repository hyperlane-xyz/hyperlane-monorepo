[package]
name = "ziggy-altvm-reference"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde_json = "=1.0.151"
hex = "=0.4.3"
bs58 = "=0.5.1"
sha2 = "=0.10.9"
ripemd = "=0.1.3"
bech32 = "=0.11.0"
ed25519-dalek = "=2.2.0"
k256 = "=0.13.4"
solana-address = { version = "=1.1.0", features = ["curve25519", "sha2"] }
solana-instruction = "=3.1.0"
solana-message = { version = "=3.0.1", features = ["bincode"] }
solana-hash = "=3.1.0"
cosmos-sdk-proto = { version = "=0.26.1", default-features = false, features = ["std", "cosmwasm"] }
prost = "=0.13.4"
tron-rs = "=0.1.0"
borsh = "1.5"
account-utils = { path = "../../../../rust/sealevel/libraries/account-utils" }
hyperlane-core = { path = "../../../../rust/main/hyperlane-core" }
hyperlane-sealevel-mailbox = { path = "../../../../rust/sealevel/programs/mailbox", features = ["no-entrypoint"] }
hyperlane-sealevel-igp = { path = "../../../../rust/sealevel/programs/hyperlane-sealevel-igp", features = ["no-entrypoint"] }
hyperlane-sealevel-interchain-security-module-interface = { path = "../../../../rust/sealevel/libraries/interchain-security-module-interface" }
serializable-account-meta = { path = "../../../../rust/sealevel/libraries/serializable-account-meta" }
solana-address-lookup-table-interface = { version = "=3.0.1", features = ["bincode", "bytemuck"] }
hyperlane-cosmos-rs = "=0.1.4"
hyperlane-cosmwasm-interface = "=0.0.6-rc6"
hyperlane-sealevel-validator-announce = { path = "../../../../rust/sealevel/programs/validator-announce", features = ["no-entrypoint"] }
serde = { version = "=1.0.228", features = ["derive"] }

solana-compute-budget-interface = { version = "=3.0.0", features = ["borsh"] }
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

hyperlane-sealevel-composite-ism = { path = "../../../../rust/sealevel/programs/ism/composite-ism", features = ["no-entrypoint"] }
multisig-ism = { path = "../../../../rust/sealevel/libraries/multisig-ism" }
