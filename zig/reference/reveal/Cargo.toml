[package]
name = "ziggy-reveal-reference"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
solana-sdk = "=3.0.0"
solana-program = "=3.0.0"
solana-commitment-config = "=3.0.0"
solana-system-interface = {version = "=2.0.0", features=["bincode"]}
solana-compute-budget-interface = "=3.0.0"
hyperlane-core = {path="../../../rust/main/hyperlane-core"}
serde = {version="=1.0.228",features=["derive"]}
serde_json = "=1.0.151"
eyre = "=0.6.8"
hex = "=0.4.3"
tokio = {version="=1.53.1",features=["macros","rt"]}
tracing = "=0.1.44"
k256 = {version="=0.13.4",features=["ecdsa"]}
bincode = "=1.3.3"
[patch.crates-io.curve25519-dalek]
branch="v3.2.2-relax-zeroize"
git="https://github.com/Eclipse-Laboratories-Inc/curve25519-dalek"
version="3.2.2"
[patch.crates-io.primitive-types]
branch="hyperlane"
git="https://github.com/hyperlane-xyz/parity-common.git"
version="=0.12.1"
[patch.crates-io.rlp]
branch="hyperlane"
git="https://github.com/hyperlane-xyz/parity-common.git"
version="=0.5.2"
